ResourceID: 
  name: id
  in: path
  required: true
  schema:
    type: string
    minLength: 1

UserID:
  name: userId
  in: path
  required: true
  schema: { type: string, minLength: 1 }

EntitlementID:
  name: entitlementId
  in: path
  required: true
  schema: { type: string, minLength: 1 }

OperationID:
  name: operationId
  in: path
  required: true
  schema: { type: string, minLength: 1 }

ConnectionScanID:
  name: scanId
  in: path
  required: true
  schema: { type: string, minLength: 1 }

DatabaseTableName:
  name: table
  in: path
  required: true
  description: Exact name from the server-provided allowlisted table catalog.
  schema:
    type: string
    pattern: '^[A-Za-z_][A-Za-z0-9_]*$'

IdempotencyKey:
  name: Idempotency-Key
  in: header
  required: true
  description: Caller-owned semantic idempotency reference.
  schema:
    type: string
    minLength: 1
    maxLength: 128

HourlyIdempotencyKey:
  name: Idempotency-Key
  in: header
  required: true
  description: Owner- and account-generation-scoped hourly action key, at most 96 UTF-8 bytes. Retry an uncertain action with the same key and payload.
  schema:
    type: string
    minLength: 1
    maxLength: 96

BrowserSessionScope:
  name: X-TXC-Session-Scope
  in: header
  required: false
  description: Set to browser when using the independent browser session and request-signing key on a shared route. Omit to use the Mini App session. This selector grants no additional permissions.
  schema:
    type: string
    enum: [browser]

OptionalIdempotencyKey:
  name: Idempotency-Key
  in: header
  required: false
  description: Caller-owned semantic idempotency reference; the server generates one when omitted.
  schema:
    type: string
    minLength: 1
    maxLength: 128

SettingKey:
  name: key
  in: path
  required: true
  schema:
    type: string
    pattern: '^[a-z][a-z0-9_.-]{1,63}$'

Cursor:
  name: cursor
  in: query
  description: Opaque cursor returned by the preceding page.
  schema:
    type: string

AdminPageLimit:
  name: limit
  in: query
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 25

Search:
  name: search
  in: query
  schema:
    type: string
    maxLength: 100

PageSize:
  name: size
  in: query
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 25

DatabasePageLimit:
  name: limit
  in: query
  schema:
    type: integer
    minimum: 1
    maximum: 200
    default: 50

OnboardingContentKind:
  name: kind
  in: path
  required: true
  schema:
    type: string
    enum: [welcome, agreements]

StatisticsFrom:
  name: from
  in: query
  schema: { type: string, format: date }

StatisticsTo:
  name: to
  in: query
  schema: { type: string, format: date }

StatisticsBucket:
  name: bucket
  in: query
  schema:
    type: string
    enum: [daily, weekly]
    default: daily

StatisticsTimeZone:
  name: timeZone
  in: query
  schema:
    type: string
    default: Asia/Shanghai
