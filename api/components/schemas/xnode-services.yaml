{
  "XNodeServiceAccess": {
    "type": "object",
    "additionalProperties": false,
    "properties": {
      "limitBytes": {
        "type": "string",
        "pattern": "^[0-9]+$"
      },
      "strategy": {
        "type": "string",
        "enum": [
          "NO_RESET",
          "DAY",
          "WEEK",
          "MONTH",
          "MONTH_ROLLING"
        ],
        "description": "Stored cadence, retained for grandfathered or imported access. New standalone terms use NO_RESET; existing cadence cannot be changed."
      },
      "startedAt": {
        "type": "string",
        "format": "date-time"
      },
      "expiresAt": {
        "type": "string",
        "format": "date-time"
      },
      "groupIds": {
        "type": "array",
        "items": {
          "type": "string"
        },
        "minItems": 1
      },
      "disabled": {
        "type": "boolean"
      }
    },
    "required": [
      "limitBytes",
      "strategy",
      "startedAt",
      "expiresAt",
      "groupIds",
      "disabled"
    ]
  },
  "XNodeNamedService": {
    "type": "object",
    "additionalProperties": false,
    "properties": {
      "identity": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "proxyUserId": {
            "type": "string"
          },
          "userId": {
            "type": "string"
          },
          "username": {
            "type": "string"
          },
          "serviceName": {
            "type": "string"
          },
          "currentPeriodId": {
            "type": "string"
          },
          "accessDisabled": {
            "type": "boolean"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "proxyUserId",
          "userId",
          "username",
          "serviceName",
          "currentPeriodId",
          "accessDisabled",
          "createdAt"
        ]
      },
      "access": {
        "$ref": "../schemas/xnode-services.yaml#/XNodeServiceAccess"
      }
    },
    "required": [
      "identity",
      "access"
    ]
  },
  "XNodeNamedServiceWrite": {
    "type": "object",
    "additionalProperties": false,
    "properties": {
      "name": {
        "type": "string"
      },
      "access": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "limitBytes": {
            "$ref": "../schemas/xnode-services.yaml#/XNodeServiceAccess/properties/limitBytes"
          },
          "strategy": {
            "$ref": "../schemas/xnode-services.yaml#/XNodeServiceAccess/properties/strategy"
          },
          "startedAt": {
            "$ref": "../schemas/xnode-services.yaml#/XNodeServiceAccess/properties/startedAt"
          },
          "expiresAt": {
            "$ref": "../schemas/xnode-services.yaml#/XNodeServiceAccess/properties/expiresAt"
          },
          "groupIds": {
            "$ref": "../schemas/xnode-services.yaml#/XNodeServiceAccess/properties/groupIds"
          },
          "disabled": {
            "$ref": "../schemas/xnode-services.yaml#/XNodeServiceAccess/properties/disabled"
          }
        },
        "required": [
          "limitBytes",
          "startedAt",
          "expiresAt",
          "groupIds",
          "disabled"
        ]
      }
    },
    "required": [
      "name",
      "access"
    ],
    "description": "Standalone access write. Cadence is optional: new terms default to NO_RESET; existing terms preserve their authoritative stored cadence. An explicit cadence must be unchanged."
  }
}
