HourlyPolicy: {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "salesEnabled",
      "dailyAllowanceBytes",
      "reducedRateBytesPerSecond",
      "extraGBPriceTXBMinor",
      "activationHours",
      "cooldownSeconds"
    ],
    "properties": {
      "salesEnabled": {
        "type": "boolean"
      },
      "dailyAllowanceBytes": {
        "type": "string",
        "pattern": "^[0-9]+$"
      },
      "reducedRateBytesPerSecond": {
        "type": "string",
        "pattern": "^[0-9]+$"
      },
      "extraGBPriceTXBMinor": {
        "type": "string",
        "pattern": "^[0-9]+$"
      },
      "activationHours": {
        "type": "integer",
        "minimum": 1,
        "maximum": 2562047
      },
      "cooldownSeconds": {
        "type": "integer",
        "minimum": 0,
        "maximum": 9223372036
      }
    },
    "description": "UTC account-wide ingress policy. Byte counts and TXB hundredths are exact decimal strings. Sales admission is disabled until all participating agents support hourly enforcement."
  }

HourlyPolicySnapshot: {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "version",
      "policy"
    ],
    "properties": {
      "version": {
        "type": "string"
      },
      "policy": {
        "$ref": "../../openapi.yaml#/components/schemas/HourlyPolicy"
      }
    }
  }

HourlyOffer: {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "groupId",
      "enabled",
      "hourlyPrice",
      "requiredHours",
      "revision",
      "createdAt",
      "updatedAt"
    ],
    "properties": {
      "groupId": {
        "type": "string"
      },
      "enabled": {
        "type": "boolean"
      },
      "hourlyPrice": {
        "$ref": "../../openapi.yaml#/components/schemas/Money"
      },
      "requiredHours": {
        "type": "integer",
        "minimum": 0,
        "maximum": 2562047,
        "description": "Per-squad funding threshold in hours; zero inherits policy.activationHours."
      },
      "revision": {
        "type": "string",
        "pattern": "^[0-9]+$",
        "description": "Zero identifies an owned retired squad with no current offer."
      },
      "createdAt": {
        "type": "string",
        "format": "date-time"
      },
      "updatedAt": {
        "type": "string",
        "format": "date-time"
      }
    }
  }

HourlyOfferWrite: {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "revision",
      "enabled",
      "hourlyPriceTXBMinor",
      "requiredHours"
    ],
    "properties": {
      "revision": {
        "type": "string",
        "pattern": "^[0-9]+$"
      },
      "enabled": {
        "type": "boolean"
      },
      "hourlyPriceTXBMinor": {
        "type": "string",
        "pattern": "^[0-9]+$"
      },
      "requiredHours": {
        "type": "integer",
        "minimum": 0,
        "maximum": 2562047,
        "description": "Per-squad funding threshold in hours; zero inherits policy.activationHours."
      }
    }
  }
