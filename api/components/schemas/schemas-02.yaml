OnboardingDraftWrite:
  type: object
  additionalProperties: false
  required: [draftRevision, content]
  properties:
    draftRevision: { type: integer, minimum: 1 }
    content: { $ref: '../../openapi.yaml#/components/schemas/LocalizedOnboardingContent' }

OnboardingPublishRequest:
  type: object
  additionalProperties: false
  required: [draftRevision]
  properties:
    draftRevision: { type: integer, minimum: 1 }

Money:
  type: object
  additionalProperties: false
  required: [currency, minor, display]
  description: Integer minor units. TXB, CNY, and USD use scale 2; XTR uses scale 0.
  properties:
    currency:
      type: string
      enum: [TXB, CNY, USD, XTR]
    minor:
      $ref: '../../openapi.yaml#/components/schemas/DecimalInteger'
    display:
      type: string
      description: Server-formatted display value; never parse this for calculations.

ResetStrategy:
  type: string
  enum: [DAY, WEEK, MONTH_ROLLING]

BroadbandSquadProfile:
  type: object
  additionalProperties: false
  required: [type, isp, portMbps, dynamic, location]
  properties:
    type: { type: string, const: broadband }
    isp: { type: string, minLength: 1 }
    portMbps: { type: integer, minimum: 1 }
    dynamic: { type: boolean }
    location: { type: string, minLength: 1 }

ChinaOptimizedSquadProfile:
  type: object
  additionalProperties: false
  required: [type, ct, cu, cm, portMbps, countryCode]
  properties:
    type: { type: string, const: china_optimized }
    ct: { type: string, minLength: 1 }
    cu: { type: string, minLength: 1 }
    cm: { type: string, minLength: 1 }
    portMbps: { type: [integer, 'null'], minimum: 1 }
    countryCode: { type: string, pattern: '^[A-Z]{2}$' }

InternationalNetworkSquadProfile:
  type: object
  additionalProperties: false
  required: [type, portMbps, countryCode, upstreamCarriers]
  properties:
    type: { type: string, const: international_network }
    portMbps: { type: [integer, 'null'], minimum: 1 }
    countryCode: { type: string, pattern: '^[A-Z]{2}$' }
    upstreamCarriers:
      type: array
      minItems: 1
      uniqueItems: true
      items: { type: string, minLength: 1 }

SquadProfile:
  oneOf:
    - $ref: '../../openapi.yaml#/components/schemas/BroadbandSquadProfile'
    - $ref: '../../openapi.yaml#/components/schemas/ChinaOptimizedSquadProfile'
    - $ref: '../../openapi.yaml#/components/schemas/InternationalNetworkSquadProfile'
  discriminator:
    propertyName: type
    mapping:
      broadband: '../../openapi.yaml#/components/schemas/BroadbandSquadProfile'
      china_optimized: '../../openapi.yaml#/components/schemas/ChinaOptimizedSquadProfile'
      international_network: '../../openapi.yaml#/components/schemas/InternationalNetworkSquadProfile'

SquadProduct:
  type: object
  additionalProperties: false
  required:
    - id
    - groupId
    - name
    - description
    - profile
    - price
    - visible
    - upstreamPresent
    - stockHeldByCurrentUser
    - activationRequired
    - accessibleNodes
    - createdAt
    - updatedAt
  properties:
    paygState:
      type: string
      enum: [normal, hidden, unavailable]
    billingMode:
      type: string
      enum: [combo, payg]
    paygPrice:
      $ref: '../../openapi.yaml#/components/schemas/Money'
    id:
      $ref: '../../openapi.yaml#/components/schemas/ID'
    groupId:
      type: string
      format: uuid
    name:
      type: string
    description:
      type: string
    profile:
      oneOf:
        - $ref: '../../openapi.yaml#/components/schemas/SquadProfile'
        - type: 'null'
    price:
      $ref: '../../openapi.yaml#/components/schemas/Money'
    visible:
      type: boolean
    activationRequired:
      type: boolean
    accessibleNodes:
      type: array
      items:
        $ref: '../../openapi.yaml#/components/schemas/CatalogNode'
    upstreamPresent:
      type: boolean
    stockLimit:
      type: [integer, 'null']
      minimum: 0
    stockRemaining:
      type: [integer, 'null']
      minimum: 0
    stockHeldByCurrentUser:
      type: boolean
      description: True only when the authenticated member already holds this squad's capacity through their active term.
    createdAt:
      $ref: '../../openapi.yaml#/components/schemas/Timestamp'
    updatedAt:
      $ref: '../../openapi.yaml#/components/schemas/Timestamp'

Combo:
  type: object
  additionalProperties: false
  required:
    - id
    - name
    - description
    - price
    - validityDays
    - trafficLimitBytes
    - resetStrategy
    - active
    - includedSquads
    - rolloverMinRemainingBps
    - createdAt
    - updatedAt
  properties:
    ipLookupQuota: {"anyOf":[{"type":"integer","minimum":0,"maximum":1000000},{"type":"null"}]}
    whitelistIpQuota: {type: integer, minimum: 0, maximum: 1000}
    id:
      $ref: '../../openapi.yaml#/components/schemas/ID'
    name:
      type: string
    description:
      type: string
    price:
      $ref: '../../openapi.yaml#/components/schemas/Money'
    validityDays:
      type: integer
      minimum: 1
      maximum: 3650
    trafficLimitBytes:
      type: string
      pattern: '^\d+$'
    resetStrategy:
      $ref: '../../openapi.yaml#/components/schemas/ResetStrategy'
    includedSquads:
      type: array
      items:
        $ref: '../../openapi.yaml#/components/schemas/SquadProduct'
    active:
      type: boolean
    rolloverMinRemainingBps:
      type: integer
      minimum: 0
      maximum: 10000
      description: Remaining traffic must be strictly greater than this basis-point threshold.
    createdAt:
      $ref: '../../openapi.yaml#/components/schemas/Timestamp'
    updatedAt:
      $ref: '../../openapi.yaml#/components/schemas/Timestamp'

CatalogNode:
  type: object
  additionalProperties: false
  required: [uuid, name, countryCode, consumptionMultiplier, providerName]
  properties:
    uuid:
      type: string
      format: uuid
    name:
      type: string
    countryCode:
      type: string
      pattern: '^[A-Z]{2}$'
    consumptionMultiplier:
      type: number
      minimum: 0
    providerName:
      type: [string, 'null']

Catalog:
  type: object
  additionalProperties: false
  required: [combos, addons, nodes]
  properties:
    autoRenewalBlockedUntil:
      type: [string, 'null']
      format: date-time
    combos:
      type: array
      items:
        $ref: '../../openapi.yaml#/components/schemas/Combo'
    addons:
      type: array
      items:
        $ref: '../../openapi.yaml#/components/schemas/SquadProduct'
    nodes:
      type: array
      items:
        $ref: '../../openapi.yaml#/components/schemas/CatalogNode'

ComboWrite:
  type: object
  additionalProperties: false
  required:
    - name
    - description
    - priceTxbMinor
    - validityDays
    - trafficLimitBytes
    - resetStrategy
    - active
    - rolloverMinRemainingBps
  properties:
    ipLookupQuota: {"anyOf":[{"type":"integer","minimum":0,"maximum":1000000},{"type":"null"}]}
    whitelistIpQuota: {type: integer, minimum: 0, maximum: 1000}
    name:
      type: string
      minLength: 1
      maxLength: 80
    description:
      type: string
      maxLength: 1000
    priceTxbMinor:
      type: string
      pattern: '^\d+$'
    validityDays:
      type: integer
      minimum: 1
      maximum: 3650
    trafficLimitBytes:
      type: string
      pattern: '^[1-9]\d*$'
    resetStrategy:
      $ref: '../../openapi.yaml#/components/schemas/ResetStrategy'
    squadProductIds:
      type: array
      uniqueItems: true
      items:
        $ref: '../../openapi.yaml#/components/schemas/ID'
    includedSquadIds:
      type: array
      uniqueItems: true
      description: Compatibility alias used by the combo picker for included live X-Node squads.
      items:
        $ref: '../../openapi.yaml#/components/schemas/ID'
    active:
      type: boolean
    rolloverMinRemainingBps:
      type: integer
      minimum: 0
      maximum: 10000

SquadProductWrite:
  type: object
  additionalProperties: false
  required: [groupId, name, description, profile, priceTxbMinor, visible, activationRequired]
  properties:
    paygState:
      type: string
      enum: [normal, hidden, unavailable]
    billingMode:
      type: string
      enum: [combo, payg]
    paygPriceTxbMinor:
      type: string
      pattern: '^\d+$'
    groupId:
      type: string
      format: uuid
    name:
      type: string
      minLength: 1
    description:
      type: string
      maxLength: 1000
    profile:
      $ref: '../../openapi.yaml#/components/schemas/SquadProfile'
    priceTxbMinor:
      type: string
      pattern: '^\d+$'
    visible:
      type: boolean
    activationRequired:
      type: boolean
    activationCode:
      type: string
      minLength: 1
      writeOnly: true
    stockLimit:
      type: [integer, 'null']
      minimum: 0
