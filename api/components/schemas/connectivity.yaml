ConnectivityConfig:
  type: object
  additionalProperties: false
  required: [scheduledEnabled, proxyUserId, intervalSeconds, timeoutSeconds, maxRetries, retryIntervalSeconds, probeUrl]
  properties:
    scheduledEnabled: { type: boolean, default: false }
    proxyUserId: { type: integer, format: int64, minimum: 0 }
    intervalSeconds: { type: integer, minimum: 60, maximum: 86400, default: 300 }
    timeoutSeconds: { type: integer, minimum: 1, maximum: 60, default: 15 }
    maxRetries: { type: integer, minimum: 0, maximum: 10, default: 10, description: Additional attempts after the initial failed check. Zero disables retries. }
    retryIntervalSeconds: { type: integer, minimum: 1, maximum: 60, default: 1, description: Delay after a failed attempt before the next retry. }
    probeUrl: { type: string, format: uri, maxLength: 2048, default: 'https://cp.cloudflare.com/generate_204' }
ConnectivityUser:
  type: object
  additionalProperties: false
  required: [id, username, status]
  properties:
    id: { type: integer, format: int64, minimum: 1 }
    username: { type: string }
    status: { type: string, enum: [ACTIVE] }
ConnectivityAttempt:
  type: object
  additionalProperties: false
  required: [id, runId, hostUuid, configHash, proxyUserId, trigger, startedAt, finishedAt, status, latencyMs, httpStatus, errorCode]
  properties:
    id: { $ref: '../../openapi.yaml#/components/schemas/ID' }
    runId: { $ref: '../../openapi.yaml#/components/schemas/ID' }
    hostUuid: { type: string, description: Empty for a subscription or account setup failure. }
    configHash: { type: string, pattern: '^[0-9a-f]{64}$' }
    proxyUserId: { type: integer, format: int64, minimum: 1 }
    trigger: { type: string, enum: [manual, scheduled] }
    startedAt: { $ref: '../../openapi.yaml#/components/schemas/Timestamp' }
    finishedAt: { anyOf: [{ $ref: '../../openapi.yaml#/components/schemas/Timestamp' }, { type: 'null' }] }
    status: { type: string, enum: [running, connected, failed, unsupported, error, interrupted] }
    latencyMs: { type: [number, 'null'], minimum: 0 }
    httpStatus: { type: [integer, 'null'], minimum: 100, maximum: 599 }
    errorCode: { type: string }
ConnectivityRun:
  type: object
  additionalProperties: false
  required: [id, status, trigger, startedAt, finishedAt, total, completed, errorCode]
  properties:
    id: { $ref: '../../openapi.yaml#/components/schemas/ID' }
    status: { type: string, enum: [running, completed, error, interrupted] }
    trigger: { type: string, enum: [manual, scheduled] }
    startedAt: { $ref: '../../openapi.yaml#/components/schemas/Timestamp' }
    finishedAt: { anyOf: [{ $ref: '../../openapi.yaml#/components/schemas/Timestamp' }, { type: 'null' }] }
    total: { type: integer, minimum: 0 }
    completed: { type: integer, minimum: 0 }
    errorCode: { type: string }
ConnectivityHostResult:
  type: object
  additionalProperties: false
  required: [hostUuid, remark, address, port, latest]
  properties:
    hostUuid: { type: string, format: uuid }
    remark: { type: string }
    address: { type: string }
    port: { type: integer }
    latest: { anyOf: [{ $ref: '../../openapi.yaml#/components/schemas/ConnectivityAttempt' }, { type: 'null' }] }
ConnectivitySnapshot:
  type: object
  additionalProperties: false
  required: [config, user, run, hosts, stale, errorCode]
  properties:
    config: { $ref: '../../openapi.yaml#/components/schemas/ConnectivityConfig' }
    user: { anyOf: [{ $ref: '../../openapi.yaml#/components/schemas/ConnectivityUser' }, { type: 'null' }] }
    run: { anyOf: [{ $ref: '../../openapi.yaml#/components/schemas/ConnectivityRun' }, { type: 'null' }] }
    hosts: { type: array, items: { $ref: '../../openapi.yaml#/components/schemas/ConnectivityHostResult' } }
    stale: { type: boolean }
    errorCode: { type: string }
ConnectivityHistory:
  type: object
  additionalProperties: false
  required: [items, nextCursor]
  properties:
    items: { type: array, items: { $ref: '../../openapi.yaml#/components/schemas/ConnectivityAttempt' } }
    nextCursor: { type: [string, 'null'] }
