EntitlementEditRequest:
  type: object
  additionalProperties: false
  required: [version, reason, comboId, validFrom, validUntil, status, trafficLimitBytes, resetStrategy, squadUuids]
  properties:
    version:
      type: string
      format: date-time
      description: Exact updatedAt value returned by the last entitlement read.
    reason: { type: string, minLength: 3, maxLength: 500 }
    comboId: { $ref: '../../openapi.yaml#/components/schemas/ID' }
    validFrom: { $ref: '../../openapi.yaml#/components/schemas/Timestamp' }
    validUntil: { $ref: '../../openapi.yaml#/components/schemas/Timestamp' }
    status: { $ref: '../../openapi.yaml#/components/schemas/EntitlementStatus' }
    trafficLimitBytes: { type: string, pattern: '^\d+$' }
    resetStrategy: { $ref: '../../openapi.yaml#/components/schemas/ResetStrategy' }
    squadUuids:
      type: array
      uniqueItems: true
      items: { type: string, format: uuid }

AdminEntitlementRefundRequest:
  type: object
  additionalProperties: false
  required: [reason, amountTxbMinor]
  properties:
    reason: { type: string, minLength: 3, maxLength: 500 }
    amountTxbMinor: { type: string, pattern: '^[1-9]\d*$' }

AdminCouponGrantRequest:
  type: object
  additionalProperties: false
  required: [couponId, reason]
  properties:
    couponId: { $ref: '../../openapi.yaml#/components/schemas/ID' }
    reason: { type: string, minLength: 3, maxLength: 500 }

AdminTemporaryBanRequest:
  type: object
  additionalProperties: false
  required: [durationMinutes, reason]
  properties:
    durationMinutes: { type: integer, minimum: 1, maximum: 525600 }
    reason: { type: string, minLength: 3, maxLength: 500 }

AdminTemporaryBan:
  type: object
  additionalProperties: false
  required: [userId, actorUserId, reason, expiresAt, unbanOperationId, restoredAt]
  properties:
    userId: { $ref: '../../openapi.yaml#/components/schemas/ID' }
    actorUserId: { $ref: '../../openapi.yaml#/components/schemas/ID' }
    reason: { type: string }
    expiresAt: { $ref: '../../openapi.yaml#/components/schemas/Timestamp' }
    unbanOperationId: { type: string }
    restoredAt: { type: [string, 'null'], format: date-time }

ComboReplacementRequest:
  type: object
  additionalProperties: false
  required: [comboId, addonSquadUuids, reason]
  properties:
    comboId: { $ref: '../../openapi.yaml#/components/schemas/ID' }
    addonSquadUuids:
      type: array
      uniqueItems: true
      items: { type: string, format: uuid }
    reason: { type: string, minLength: 3, maxLength: 500 }

BulkExtensionRequest:
  type: object
  additionalProperties: false
  required: [comboIds, addonSquadUuids]
  oneOf:
    - required: [durationMinutes]
    - required: [days]
  properties:
    comboIds:
      type: array
      uniqueItems: true
      items: { $ref: '../../openapi.yaml#/components/schemas/ID' }
    addonSquadUuids:
      type: array
      uniqueItems: true
      items: { type: string, format: uuid }
    durationMinutes: { type: integer, minimum: 1, maximum: 5256000 }
    days: { type: integer, minimum: 1, maximum: 3650, deprecated: true }

BulkExtensionPreview:
  type: object
  additionalProperties: false
  required: [matchedUsers, activePurchases, queuedSuccessors]
  properties:
    matchedUsers: { type: integer, minimum: 0 }
    activePurchases: { type: integer, minimum: 0 }
    queuedSuccessors: { type: integer, minimum: 0 }

BulkExtensionCreateRequest:
  type: object
  additionalProperties: false
  required: [comboIds, addonSquadUuids, reason]
  oneOf:
    - required: [durationMinutes]
    - required: [days]
  properties:
    comboIds:
      type: array
      uniqueItems: true
      items: { $ref: '../../openapi.yaml#/components/schemas/ID' }
    addonSquadUuids:
      type: array
      uniqueItems: true
      items: { type: string, format: uuid }
    durationMinutes: { type: integer, minimum: 1, maximum: 5256000 }
    days: { type: integer, minimum: 1, maximum: 3650, deprecated: true }
    reason: { type: string, minLength: 3, maxLength: 500 }

OperationResolutionRequest:
  type: object
  additionalProperties: false
  required: [resolution, reason]
  properties:
    resolution: { type: string, enum: [succeeded, failed, compensated, partial] }
    reason: { type: string, minLength: 3, maxLength: 500 }

AdminSynchronization:
  type: object
  additionalProperties: false
  required: [status]
  properties:
    status: { type: string, enum: [synchronized, pending, failed, not_provisioned] }
    remoteUserId: { type: [string, 'null'] }
    lastError: { type: [string, 'null'] }

AdminUserDetail:
  type: object
  additionalProperties: false
  required: [user, balance, synchronization, entitlements, embyAccounts, payments, refunds, operations, ipBlocks, couponWallet, affiliateHistory, temporaryBan, autoTrafficResetEnabled, pmConversation]
  properties:
    user: { $ref: '../../openapi.yaml#/components/schemas/User' }
    balance: { $ref: '../../openapi.yaml#/components/schemas/Money' }
    synchronization: { $ref: '../../openapi.yaml#/components/schemas/AdminSynchronization' }
    activeCombo: { anyOf: [{ $ref: '../../openapi.yaml#/components/schemas/AdminEntitlement' }, { type: 'null' }] }
    entitlements:
      type: array
      items: { $ref: '../../openapi.yaml#/components/schemas/AdminEntitlement' }
    embyAccounts:
      type: array
      items: { $ref: '../../openapi.yaml#/components/schemas/EmbyAccount' }
    payments:
      type: array
      items: { $ref: '../../openapi.yaml#/components/schemas/AdminPaymentOrder' }
    refunds:
      type: array
      items: { $ref: '../../openapi.yaml#/components/schemas/Refund' }
    operations:
      type: array
      items: { $ref: '../../openapi.yaml#/components/schemas/OperationReceipt' }
    ipBlocks:
      type: array
      items: { $ref: '../../openapi.yaml#/components/schemas/IPBlock' }
    couponWallet:
      type: array
      items: { $ref: '../../openapi.yaml#/components/schemas/CouponGrant' }
    affiliateHistory: { $ref: './schemas-20.yaml#/AffiliateReferralPage' }
    temporaryBan: { anyOf: [{ $ref: '../../openapi.yaml#/components/schemas/AdminTemporaryBan' }, { type: 'null' }] }
    autoTrafficResetEnabled: { type: boolean }
    pmConversation: { anyOf: [{ $ref: '../../openapi.yaml#/components/schemas/PMConversation' }, { type: 'null' }] }
