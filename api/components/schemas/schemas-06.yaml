GroupMessageRewardStatus:
  type: object
  additionalProperties: false
  required: [enabled, localDate, messageCount, threshold, rewardMinor, rewarded]
  properties:
    enabled:
      type: boolean
    localDate:
      type: string
      format: date
    messageCount:
      type: integer
      minimum: 0
    threshold:
      type: integer
      minimum: 0
    rewardMinor:
      description: Effective boosted reward before settlement; the immutable ledger amount after settlement.
      type: string
      pattern: '^\d+$'
    rewarded:
      type: boolean
    rewardedAt:
      $ref: '../../openapi.yaml#/components/schemas/Timestamp'

GroupBoostStatus:
  type: object
  additionalProperties: false
  required: [state, count, boostUrl]
  properties:
    state:
      type: string
      enum: [required, boosted, unavailable]
    count:
      type: [integer, 'null']
      minimum: 0
    boostUrl:
      type: [string, 'null']
      format: uri

ActivityOverview:
  type: object
  additionalProperties: false
  required: [balance, timeZone, checkedInToday, dailyRewardMinTxbMinor, dailyRewardMaxTxbMinor, games, draws, recentResults, groupMessageReward, groupBoost]
  properties:
    groupBoost:
      $ref: '../../openapi.yaml#/components/schemas/GroupBoostStatus'
    balance:
      $ref: '../../openapi.yaml#/components/schemas/Money'
    timeZone:
      type: string
      examples: [Asia/Shanghai]
    checkedInToday:
      type: boolean
    dailyRewardMinTxbMinor:
      description: Effective boosted minimum, or zero while eligibility is unverified or missing.
      type: string
      pattern: '^\d+$'
    dailyRewardMaxTxbMinor:
      description: Effective boosted maximum, or zero while eligibility is unverified or missing.
      type: string
      pattern: '^\d+$'
    games:
      type: array
      items:
        $ref: '../../openapi.yaml#/components/schemas/ActivityGame'
    draws:
      type: array
      items:
        $ref: '../../openapi.yaml#/components/schemas/LuckyDraw'
    recentResults:
      type: array
      items:
        $ref: '../../openapi.yaml#/components/schemas/ActivityResult'
    groupMessageReward:
      $ref: '../../openapi.yaml#/components/schemas/GroupMessageRewardStatus'

ActivityBetRequest:
  type: object
  additionalProperties: false
  required: [gameId, stakeTxbMinor]
  properties:
    gameId:
      $ref: '../../openapi.yaml#/components/schemas/ID'
    stakeTxbMinor:
      type: string
      pattern: '^[1-9]\d*$'

ActivityDrawRequest:
  type: object
  additionalProperties: false
  required: [drawId]
  properties:
    drawId:
      $ref: '../../openapi.yaml#/components/schemas/ID'

ActivitySettings:
  type: object
  additionalProperties: false
  required: [timezone, dailyRewardMinTxb, dailyRewardMinTxbMinor, dailyRewardMaxTxb, dailyRewardMaxTxbMinor, groupMessageThreshold, groupMessageRewardTxb, groupMessageRewardTxbMinor]
  properties:
    timezone:
      type: string
    dailyRewardMinTxb:
      type: string
      pattern: '^\d+\.\d{2}$'
    dailyRewardMinTxbMinor:
      type: string
      pattern: '^\d+$'
    dailyRewardMaxTxb:
      type: string
      pattern: '^\d+\.\d{2}$'
    dailyRewardMaxTxbMinor:
      type: string
      pattern: '^\d+$'
    groupMessageThreshold:
      type: integer
      minimum: 0
    groupMessageRewardTxb:
      type: string
      pattern: '^\d+\.\d{2}$'
    groupMessageRewardTxbMinor:
      type: string
      pattern: '^\d+$'

ActivitySettingsWrite:
  type: object
  additionalProperties: false
  required: [timezone, dailyRewardMinTxb, dailyRewardMaxTxb, groupMessageThreshold, groupMessageRewardTxb]
  properties:
    timezone:
      type: string
      examples: [Asia/Shanghai]
    dailyRewardMinTxb:
      type: string
      pattern: '^\d+\.\d{2}$'
    dailyRewardMaxTxb:
      type: string
      pattern: '^\d+\.\d{2}$'
    groupMessageThreshold:
      type: integer
      minimum: 0
    groupMessageRewardTxb:
      type: string
      pattern: '^\d+\.\d{2}$'

LuckyDrawPrize:
  type: object
  additionalProperties: false
  required: [id, name, reward]
  properties:
    id:
      $ref: '../../openapi.yaml#/components/schemas/ID'
    name:
      type: string
    probabilityBps: { type: integer, minimum: 1, maximum: 10000 }
    stock: { type: integer, format: int64, minimum: 1 }
    reward:
      $ref: '../../openapi.yaml#/components/schemas/Reward'

LuckyDrawPrizeWrite:
  type: object
  additionalProperties: false
  required: [name, reward]
  properties:
    id:
      type: string
    name:
      type: string
      minLength: 1
    probabilityBps: { type: integer, minimum: 1, maximum: 10000 }
    stock: { type: integer, format: int64, minimum: 1 }
    reward:
      $ref: '../../openapi.yaml#/components/schemas/RewardWrite'

LuckyDrawAdmin:
  type: object
  additionalProperties: false
  required: [id, name, description, kind, status, enabled, feeTxbMinor, seats, prizes, createdAt, updatedAt]
  properties:
    id:
      $ref: '../../openapi.yaml#/components/schemas/ID'
    name:
      type: string
    description:
      type: string
    kind: { type: string, enum: [instant, raffle] }
    status: { type: string, enum: [draft, publishing, open, settling, completed, cancelled] }
    enabled:
      type: boolean
    feeTxbMinor:
      type: string
      pattern: '^\d+$'
    expectedParticipation: { type: integer, minimum: 1 }
    threshold: { type: integer, minimum: 1 }
    keyword: { type: string }
    command: { type: string }
    seats: { type: integer, minimum: 0 }
    prizes:
      type: array
      items:
        $ref: '../../openapi.yaml#/components/schemas/LuckyDrawPrize'
    createdAt:
      $ref: '../../openapi.yaml#/components/schemas/Timestamp'
    updatedAt:
      $ref: '../../openapi.yaml#/components/schemas/Timestamp'

LuckyDrawWrite:
  type: object
  additionalProperties: false
  required: [name, description, kind, enabled, feeTxbMinor, expectedParticipation, threshold, keyword, command, prizes]
  properties:
    name:
      type: string
      minLength: 1
    description:
      type: string
    kind: { type: string, enum: [instant, raffle] }
    enabled:
      type: boolean
    feeTxbMinor:
      type: string
      pattern: '^\d+$'
    expectedParticipation: { type: integer, minimum: 0 }
    threshold: { type: integer, minimum: 0 }
    keyword: { type: string }
    command: { type: string }
    prizes:
      type: array
      minItems: 1
      items:
        $ref: '../../openapi.yaml#/components/schemas/LuckyDrawPrizeWrite'

LuckyDrawAdminList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '../../openapi.yaml#/components/schemas/LuckyDrawAdmin'

LuckyDrawForecast:
  type: object
  additionalProperties: false
  required: [entries, incomeMinor, expectedExpenseMinMinor, expectedExpenseMaxMinor, possibleExpenseMinMinor, possibleExpenseMaxMinor, breakEvenMinMinor, breakEvenMaxMinor, averageBalanceMinor, multiplierUnavailable, couponOneTermOnly]
  properties:
    entries: { type: integer, minimum: 1 }
    incomeMinor: { type: string }
    expectedExpenseMinMinor: { type: [string, 'null'] }
    expectedExpenseMaxMinor: { type: [string, 'null'] }
    possibleExpenseMinMinor: { type: [string, 'null'] }
    possibleExpenseMaxMinor: { type: [string, 'null'] }
    breakEvenMinMinor: { type: [string, 'null'] }
    breakEvenMaxMinor: { type: [string, 'null'] }
    averageBalanceMinor: { type: [string, 'null'] }
    multiplierUnavailable: { type: boolean }
    couponOneTermOnly: { type: boolean }

CouponKind:
  type: string
  enum: [purchase_recurring, purchase_once, balance_add, balance_multiply]

CouponDiscountMode:
  type: string
  enum: [fixed, percent]

RewardWrite:
  description: Current configurable rewards; historical traffic_reset results remain read-only.
  allOf:
    - $ref: '../../openapi.yaml#/components/schemas/Reward'
    - type: object
      properties:
        kind:
          type: string
          enum: [none, txb_delta, coupon_grant, subscription_extension, entitlement_grant, squad_access, core_combo_switch, traffic_grant, balance_multiplier, coupon_recurring, coupon_once]
