USDTNetworkID:
  type: string
  enum: [tron, ethereum, bsc, polygon, arbitrum, xlayer, plasma, solana, aptos, ton]
USDTEndpoint:
  type: object
  additionalProperties: false
  required: [id, rpcUrl, wsUrl, indexerUrl, apiKey, useWs, rpcConfigured, wsConfigured, indexerConfigured, keyConfigured, host]
  properties:
    id: { type: string, pattern: '^[a-zA-Z0-9_-]{1,64}$' }
    rpcUrl: { type: string, maxLength: 4096, description: 'Write-only; blank preserves the previous URL.' }
    wsUrl: { type: string, maxLength: 4096, description: 'Write-only; blank preserves the previous URL.' }
    indexerUrl: { type: string, maxLength: 4096, description: 'Aptos GraphQL URL; write-only.' }
    apiKey: { type: string, maxLength: 4096, description: 'Write-only; blank preserves the previous key.' }
    useWs: { type: boolean }
    rpcConfigured: { type: boolean }
    wsConfigured: { type: boolean }
    indexerConfigured: { type: boolean }
    keyConfigured: { type: boolean }
    host: { type: string, description: 'Sanitized RPC hostname; no credential-bearing path or query.' }
USDTNetworkConfig:
  type: object
  additionalProperties: false
  required: [network, enabled, addresses, endpoints]
  properties:
    network: { $ref: '#/USDTNetworkID' }
    enabled: { type: boolean }
    addresses: { type: array, maxItems: 128, items: { type: string } }
    endpoints: { type: array, maxItems: 8, items: { $ref: '#/USDTEndpoint' } }
USDTConfig:
  type: object
  additionalProperties: false
  required: [enabled, name, rate, expiryMinutes, concurrency, networks]
  properties:
    enabled: { type: boolean }
    name: { type: string, minLength: 1, maxLength: 64 }
    mode: { type: string, enum: [usdt, usdc, both], default: usdt, description: 'Missing legacy values retain USDT. Network endpoints, addresses and concurrency are shared.' }
    rate: { type: string, description: 'Exact TXB per token; required while enabled.' }
    expiryMinutes: { type: integer, minimum: 5, maximum: 120, default: 30 }
    concurrency: { type: integer, minimum: 1, maximum: 8, description: 'One shared cap across all RPC, indexer, probe, reconnect and WebSocket requests.' }
    networks: { type: array, maxItems: 10, items: { $ref: '#/USDTNetworkConfig' } }
USDTNetworkStatus:
  type: object
  additionalProperties: false
  required: [network, token, rail, state, cursor, updatedAt, errorCode, connection]
  properties:
    network: { $ref: '#/USDTNetworkID' }
    token: { type: string, description: Pinned native token identity. }
    rail: { type: string }
    state: { type: string, enum: [disabled, ready, catching_up, error] }
    cursor: { type: string, description: 'Durable adapter-specific processed progress.' }
    updatedAt: { type: [string, 'null'], format: date-time }
    errorCode: { type: string }
    connection: { type: string, enum: ['', none, polling, websocket] }
USDTStatus:
  type: object
  additionalProperties: false
  required: [networks]
  properties:
    networks: { type: array, items: { $ref: '#/USDTNetworkStatus' } }
USDTCheckRequest:
  type: object
  additionalProperties: false
  required: [network]
  properties:
    network: { $ref: '#/USDTNetworkID' }
    rail: { type: string, description: 'Token-specific rail; omitted means USDT for compatibility.' }
USDTCheckResult:
  type: object
  additionalProperties: false
  required: [network, token, rail, success, errorCode]
  properties:
    network: { $ref: '#/USDTNetworkID' }
    token: { type: string }
    rail: { type: string }
    success: { type: boolean }
    errorCode: { type: string }
USDTTransfer:
  type: object
  additionalProperties: false
  required: [id, currency, network, token, recipient, atomicAmount, amount, txHash, eventId, occurredAt, orderId, status, reason]
  properties:
    id: { type: string }
    currency: { type: string, enum: [USDT, USDC] }
    network: { $ref: '#/USDTNetworkID' }
    token: { type: string }
    recipient: { type: string }
    atomicAmount: { type: string, pattern: '^[0-9]+$' }
    amount: { type: string }
    txHash: { type: string }
    eventId: { type: string }
    occurredAt: { type: string, format: date-time }
    orderId: { type: string }
    status: { type: string, enum: [ready, review, credited, dismissed] }
    reason: { type: string }
USDTReviewPage:
  type: object
  additionalProperties: false
  required: [items, nextCursor]
  properties:
    items: { type: array, items: { $ref: '#/USDTTransfer' } }
    nextCursor: { type: string }
USDTResolutionRequest:
  type: object
  additionalProperties: false
  required: [reason]
  properties:
    action: { type: string, enum: [settle, dismiss], default: settle }
    orderId: { type: string, minLength: 1, maxLength: 128 }
    reason: { type: string, minLength: 1, maxLength: 500 }
USDTResolution:
  type: object
  additionalProperties: false
  required: [orderId, transferId, credited, replayed]
  properties:
    orderId: { type: string }
    transferId: { type: string }
    credited: { type: boolean }
    replayed: { type: boolean }
