AutoRenewal:
  type: object
  additionalProperties: false
  required: [purchaseId, enabled, canEnable, ineligibleReason, grossPrice, discount, netPrice, scheduledAt, nextCycleEndsAt]
  properties:
    purchaseId: { $ref: '../../openapi.yaml#/components/schemas/ID' }
    enabled: { type: boolean }
    canEnable: { type: boolean }
    ineligibleReason: { type: [string, 'null'] }
    grossPrice: { $ref: '../../openapi.yaml#/components/schemas/Money' }
    discount: { $ref: '../../openapi.yaml#/components/schemas/Money' }
    netPrice: { $ref: '../../openapi.yaml#/components/schemas/Money' }
    scheduledAt: { $ref: '../../openapi.yaml#/components/schemas/Timestamp' }
    nextCycleEndsAt: { $ref: '../../openapi.yaml#/components/schemas/Timestamp' }

AutoRenewalUpdate:
  type: object
  additionalProperties: false
  required: [enabled]
  properties:
    enabled: { type: boolean }

AutoRenewalFailure:
  type: object
  additionalProperties: false
  required: [purchaseId, reason, failedAt]
  properties:
    purchaseId: { $ref: '../../openapi.yaml#/components/schemas/ID' }
    reason: { type: string }
    failedAt: { $ref: '../../openapi.yaml#/components/schemas/Timestamp' }

PaymentProfile:
  type: object
  additionalProperties: false
  required: [id, provider, providerName, enabledChannels, endpoint, merchantId, credential, acknowledgement, enabled, configured]
  properties:
    id: { type: string }
    provider: { type: string, enum: [ezpay, bepusdt] }
    providerName: { type: string, minLength: 1, maxLength: 80 }
    enabledChannels:
      type: array
      items: { type: string }
    endpoint: { type: string, format: uri }
    merchantId: { type: string }
    credential: { type: string, description: Masked credential placeholder; no plaintext secret is returned. }
    acknowledgement: { type: string }
    enabled: { type: boolean }
    configured: { type: boolean }

PaymentProfileWrite:
  type: object
  additionalProperties: false
  required: [provider, providerName, enabledChannels, endpoint, enabled]
  properties:
    id: { type: string }
    provider: { type: string, enum: [ezpay, bepusdt] }
    providerName: { type: string, minLength: 1, maxLength: 80 }
    enabledChannels:
      type: array
      items: { type: string }
    endpoint: { type: string, format: uri }
    merchantId: { type: string }
    credential:
      type: string
      writeOnly: true
      description: Blank or masked input retains an existing credential only while provider, endpoint and merchant are unchanged. Changing that identity requires a fresh credential. If retained orders still require this account, create a replacement profile and disable the old profile instead; credential or identity edits return PAYMENT_PROFILE_IN_USE.
    acknowledgement: { type: string }
    enabled: { type: boolean }
