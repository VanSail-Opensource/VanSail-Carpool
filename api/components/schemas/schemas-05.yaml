PaymentOrder:
  type: object
  additionalProperties: false
  required:
    - id
    - provider
    - methodId
    - providerRail
    - status
    - txb
    - payableAmount
    - payableCurrency
    - rateSnapshot
    - rateDirection
    - paymentUrl
    - qrPayload
    - receivingAddress
    - actualCryptoAmount
    - actualCryptoCurrency
    - expiresAt
    - paidAt
    - refundedAt
    - cancelledAt
    - cancelReason
    - providerCancelStatus
    - createdAt
    - updatedAt
  properties:
    id:
      $ref: '../../openapi.yaml#/components/schemas/ID'
    provider:
      $ref: '../../openapi.yaml#/components/schemas/PaymentProvider'
    methodId:
      $ref: '../../openapi.yaml#/components/schemas/PaymentOrderMethodID'
    providerRail:
      type: string
    status:
      $ref: '../../openapi.yaml#/components/schemas/PaymentStatus'
    txb:
      $ref: '../../openapi.yaml#/components/schemas/Money'
    payableAmount:
      type: string
      pattern: '^\d+(\.\d+)?$'
    payableCurrency:
      type: string
      enum: [CNY, USD, XTR, USDT]
    rateSnapshot:
      type: string
      pattern: '^\d+(\.\d+)?$'
      description: Immutable fixed-decimal rate used when the order was created.
    rateDirection:
      type: string
      enum: [txb_per_currency, currency_per_txb]
      description: New orders use txb_per_currency; the legacy direction is retained only for immutable pending snapshots.
    paymentUrl:
      type: [string, 'null']
      format: uri
    qrPayload:
      type: [string, 'null']
    receivingAddress:
      type: [string, 'null']
    actualCryptoAmount:
      type: [string, 'null']
      pattern: '^\d+(\.\d+)?$'
    actualCryptoCurrency:
      type: [string, 'null']
      enum: [USDT, USDC, null]
    expiresAt:
      $ref: '../../openapi.yaml#/components/schemas/Timestamp'
    paidAt:
      type: [string, 'null']
      format: date-time
    refundedAt:
      type: [string, 'null']
      format: date-time
    cancelledAt:
      type: [string, 'null']
      format: date-time
    cancelReason:
      type: string
    providerCancelStatus:
      type: string
      enum: ['', unsupported, requested, cancelled, failed]
    createdAt:
      $ref: '../../openapi.yaml#/components/schemas/Timestamp'
    updatedAt:
      $ref: '../../openapi.yaml#/components/schemas/Timestamp'

ActivityGame:
  type: object
  additionalProperties: false
  required: [id, name, icon, description, enabled, winChanceBps, minimumStakeMinor, maximumStakeMinor, returnMultiplierBps]
  properties:
    id:
      $ref: '../../openapi.yaml#/components/schemas/ID'
    name:
      type: string
    icon:
      type: string
    description:
      type: string
    enabled:
      type: boolean
    winChanceBps:
      type: integer
      minimum: 0
      maximum: 10000
    minimumStakeMinor:
      type: string
      pattern: '^[1-9]\d*$'
    maximumStakeMinor:
      type: string
      pattern: '^[1-9]\d*$'
    returnMultiplierBps:
      type: integer
      format: int64
      minimum: 0

ActivityGameWrite:
  type: object
  additionalProperties: false
  required: [name, icon, description, enabled, winChanceBps, minimumStakeMinor, maximumStakeMinor, returnMultiplierBps]
  properties:
    name:
      type: string
      minLength: 1
    icon:
      type: string
    description:
      type: string
    enabled:
      type: boolean
    winChanceBps:
      type: integer
      minimum: 0
      maximum: 10000
    minimumStakeMinor:
      type: string
      pattern: '^[1-9]\d*$'
    maximumStakeMinor:
      type: string
      pattern: '^[1-9]\d*$'
    returnMultiplierBps:
      type: integer
      format: int64
      minimum: 0

ActivityGameList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '../../openapi.yaml#/components/schemas/ActivityGame'

LuckyDraw:
  type: object
  additionalProperties: false
  required: [id, name, description, feeTxbMinor, enabled, prizes]
  properties:
    id:
      $ref: '../../openapi.yaml#/components/schemas/ID'
    name:
      type: string
    description:
      type: string
    feeTxbMinor:
      type: string
      pattern: '^\d+$'
    enabled:
      type: boolean
    prizes:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [id, name]
        properties:
          id:
            $ref: '../../openapi.yaml#/components/schemas/ID'
          name:
            type: string

Reward:
  type: object
  additionalProperties: false
  required: [kind]
  properties:
    kind: { type: string, enum: [none, txb_delta, coupon_grant, subscription_extension, entitlement_grant, squad_access, core_combo_switch, traffic_grant, traffic_reset, balance_multiplier, coupon_recurring, coupon_once] }
    txbDeltaMinor: { $ref: '../../openapi.yaml#/components/schemas/DecimalInteger' }
    couponId: { type: string }
    extensionDays: { type: integer, minimum: 1 }
    range:
      type: object
      additionalProperties: false
      required: [min, max, distribution]
      properties:
        min: { type: integer, format: int64 }
        max: { type: integer, format: int64 }
        distribution: { type: string, enum: [uniform, gaussian, power_law] }
        positiveChanceBps: { type: integer, minimum: 0, maximum: 10000 }
    resolvedValue: { type: integer, format: int64 }
    comboId: { type: string }
    squadUuids: { type: array, items: { type: string } }
    renewalPriceMinor: { type: integer, format: int64, minimum: 0 }
    trafficLimitBytes: { type: integer, format: int64, minimum: 1 }
    includeInRenewal: { type: boolean }
    discountMode: { type: string, enum: [fixed, percent] }

ActivityResult:
  type: object
  additionalProperties: false
  required: [id, kind, outcome, message, reward, balanceAfter, createdAt]
  properties:
    id:
      $ref: '../../openapi.yaml#/components/schemas/ID'
    kind:
      type: string
      enum: [check_in, bet, draw]
    outcome:
      type: string
      enum: [complete, win, loss]
    message:
      type: string
    reward:
      $ref: '../../openapi.yaml#/components/schemas/Reward'
    stakeTxbMinor:
      type: string
      pattern: '^[1-9]\d*$'
    drawId:
      $ref: '../../openapi.yaml#/components/schemas/ID'
    prizeId:
      $ref: '../../openapi.yaml#/components/schemas/ID'
    prizeName:
      type: string
    balanceAfter:
      $ref: '../../openapi.yaml#/components/schemas/Money'
    createdAt:
      $ref: '../../openapi.yaml#/components/schemas/Timestamp'
