UptimeState:
  type: string
  enum: [operational, partial, outage, unknown]
UptimeSegment:
  type: object
  additionalProperties: false
  required: [from, to, state]
  properties:
    from: { type: string, format: date-time }
    to: { type: string, format: date-time }
    state: { $ref: '../../openapi.yaml#/components/schemas/UptimeState' }
UptimeTimeline:
  type: object
  additionalProperties: false
  required: [from, to, state, segments]
  properties:
    from: { type: string, format: date-time }
    to: { type: string, format: date-time }
    state: { $ref: '../../openapi.yaml#/components/schemas/UptimeState' }
    segments:
      type: array
      items: { $ref: '../../openapi.yaml#/components/schemas/UptimeSegment' }
UptimeSummary:
  type: object
  additionalProperties: false
  required: [activeCombo, from, to, state, segments, errorCode]
  properties:
    monitoringEnabled: { type: boolean, default: false, description: Scheduled host monitoring is enabled; hide member network-status displays otherwise. }
    activeCombo: { type: boolean }
    from: { type: string, format: date-time }
    to: { type: string, format: date-time }
    state: { $ref: '../../openapi.yaml#/components/schemas/UptimeState' }
    segments:
      type: array
      items: { $ref: '../../openapi.yaml#/components/schemas/UptimeSegment' }
    errorCode: { type: string }
SubscriptionHost:
  type: object
  additionalProperties: false
  required: [uuid, name, countryCodes, squadUuids, link, linkErrorCode, timeline]
  properties:
    uuid: { type: string }
    name: { type: string }
    countryCodes: { type: array, items: { type: string } }
    squadUuids: { type: array, items: { type: string } }
    link: { type: [string, 'null'] }
    linkErrorCode: { type: string }
    timeline: { $ref: '../../openapi.yaml#/components/schemas/UptimeTimeline' }
SubscriptionSquad:
  type: object
  additionalProperties: false
  required: [uuid, name, hostUuids, timeline]
  properties:
    uuid: { type: string }
    name: { type: string }
    hostUuids: { type: array, items: { type: string } }
    timeline: { $ref: '../../openapi.yaml#/components/schemas/UptimeTimeline' }
MemberSubscription:
  type: object
  additionalProperties: false
  required: [activeCombo, subscriptionUrl, summary, hosts, squads]
  properties:
    activeCombo: { type: boolean }
    subscriptionUrl: { type: [string, 'null'] }
    summary: { $ref: '../../openapi.yaml#/components/schemas/UptimeSummary' }
    hosts:
      type: array
      items: { $ref: '../../openapi.yaml#/components/schemas/SubscriptionHost' }
    squads:
      type: array
      items: { $ref: '../../openapi.yaml#/components/schemas/SubscriptionSquad' }
