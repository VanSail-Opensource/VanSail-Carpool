HourlyAccountUsage: {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "dayUTC",
      "freeAllowanceBytes",
      "freeUsedBytes",
      "freeReservedBytes",
      "extraFundedBytes",
      "extraUsedBytes",
      "extraReservedBytes",
      "extraExpiresAt",
      "reducedRateBytesPerSecond",
      "accountingPending"
    ],
    "properties": {
      "dayUTC": {
        "type": "string",
        "format": "date"
      },
      "freeAllowanceBytes": {
        "type": "string",
        "pattern": "^[0-9]+$"
      },
      "freeUsedBytes": {
        "type": "string",
        "pattern": "^[0-9]+$"
      },
      "freeReservedBytes": {
        "type": "string",
        "pattern": "^[0-9]+$"
      },
      "extraFundedBytes": {
        "type": "string",
        "pattern": "^[0-9]+$"
      },
      "extraUsedBytes": {
        "type": "string",
        "pattern": "^[0-9]+$"
      },
      "extraReservedBytes": {
        "type": "string",
        "pattern": "^[0-9]+$"
      },
      "extraExpiresAt": {
        "type": "string",
        "format": "date-time"
      },
      "reducedRateBytesPerSecond": {
        "type": "string",
        "pattern": "^[0-9]+$"
      },
      "accountingPending": {
        "type": "boolean",
        "description": "Compatibility flag: any unsealed reservation or recovery-unknown bytes in the current account generation, across all UTC days. A normal open credit also sets this flag; use accounting for display distinctions."
      },
      "accounting": {
        "type": "object",
        "additionalProperties": false,
        "description": "Read-only reservation breakdown for this account generation. Current fields belong to dayUTC; historical fields include every other UTC day. Historical holds do not reduce dayUTC's allowance. No amount is released by this projection.",
        "required": ["openReservedBytes", "recoveryUnknownBytes", "freeRecoveryUnknownBytes", "extraRecoveryUnknownBytes", "historicalRecoveryUnknownBytes", "historicalUnsealedReservedBytes", "historicalUnsealedCount"],
        "properties": {
          "openReservedBytes": {
            "type": "string", "pattern": "^[0-9]+$",
            "description": "Bytes held by unsealed reservations on dayUTC, including ordinary live credits. Does not imply a synchronization failure."
          },
          "recoveryUnknownBytes": {
            "type": "string", "pattern": "^[0-9]+$",
            "description": "Bytes still unknown after a final recovery proof on dayUTC. They remain reserved; automatic reconciliation is not promised."
          },
          "freeRecoveryUnknownBytes": {
            "type": "string", "pattern": "^[0-9]+$",
            "description": "The free-allowance portion of recoveryUnknownBytes on dayUTC. Exclude it from usable remaining allowance without counting it as confirmed consumption or subtracting ordinary open credits."
          },
          "extraRecoveryUnknownBytes": {
            "type": "string", "pattern": "^[0-9]+$",
            "description": "The funded-extra portion of recoveryUnknownBytes on dayUTC. Exclude it from usable remaining extra credit without counting it as confirmed consumption or subtracting ordinary open credits."
          },
          "historicalRecoveryUnknownBytes": {
            "type": "string", "pattern": "^[0-9]+$",
            "description": "Recovery-unknown bytes retained against UTC days other than dayUTC."
          },
          "historicalUnsealedReservedBytes": {
            "type": "string", "pattern": "^[0-9]+$",
            "description": "Bytes held by unsealed reservations from UTC days other than dayUTC."
          },
          "historicalUnsealedCount": {
            "type": "string", "pattern": "^[0-9]+$",
            "description": "Unsealed reservations from UTC days other than dayUTC, including records with zero remaining held bytes."
          }
        }
      }
    }
  }

HourlySquadView: {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "offer",
      "squad",
      "enrollment",
      "ready",
      "reasonCode",
      "cooldownUntil",
      "requiredBalance"
    ],
    "properties": {
      "offer": {
        "$ref": "../../openapi.yaml#/components/schemas/HourlyOffer"
      },
      "squad": {
        "$ref": "../../openapi.yaml#/components/schemas/SquadProduct"
      },
      "enrollment": {
        "anyOf": [
          {
            "$ref": "../../openapi.yaml#/components/schemas/HourlyEnrollment"
          },
          {
            "type": "null"
          }
        ]
      },
      "ready": {
        "type": "boolean"
      },
      "reasonCode": {
        "type": "string"
      },
      "cooldownUntil": {
        "type": [
          "string",
          "null"
        ],
        "format": "date-time"
      },
      "requiredBalance": {
        "description": "hourlyPrice multiplied by the squad's effective required hours: offer.requiredHours when positive, otherwise policy.activationHours.",
        "anyOf": [
          {
            "$ref": "../../openapi.yaml#/components/schemas/Money"
          },
          {
            "type": "null"
          }
        ]
      }
    }
  }

HourlyAccountView: {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "policy",
      "balance",
      "legacyBlocked",
      "extraPreference",
      "usage",
      "squads"
    ],
    "properties": {
      "policy": {
        "$ref": "../../openapi.yaml#/components/schemas/HourlyPolicySnapshot"
      },
      "balance": {
        "$ref": "../../openapi.yaml#/components/schemas/Money"
      },
      "legacyBlocked": {
        "type": "boolean"
      },
      "extraPreference": {
        "$ref": "../../openapi.yaml#/components/schemas/HourlyExtraPreference"
      },
      "usage": {
        "anyOf": [
          {
            "$ref": "../../openapi.yaml#/components/schemas/HourlyAccountUsage"
          },
          {
            "type": "null"
          }
        ]
      },
      "squads": {
        "type": "array",
        "items": {
          "$ref": "../../openapi.yaml#/components/schemas/HourlySquadView"
        }
      }
    }
  }
