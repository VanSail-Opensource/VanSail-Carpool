EmbyRating:
  type: object
  additionalProperties: false
  required: [name, value]
  properties:
    name:
      type: string
    value:
      type: integer
      format: int32

EmbyLibrary:
  type: object
  additionalProperties: false
  required: [id, name]
  properties:
    id:
      type: string
    name:
      type: string

EmbyAccount:
  type: object
  additionalProperties: false
  required: [id, username, status, maxParentalRating, disabledLibraryIds, retryable, updatedAt]
  properties:
    id:
      $ref: '../../openapi.yaml#/components/schemas/ID'
    username:
      type: string
    status:
      type: string
      enum: [queued, provisioning, active, failed, pending_review]
    maxParentalRating:
      type: [integer, 'null']
      format: int32
    disabledLibraryIds:
      type: array
      uniqueItems: true
      items:
        type: string
    retryable:
      type: boolean
    errorMessage:
      type: string
      description: Redacted operator-safe failure detail; absent when empty.
    updatedAt:
      $ref: '../../openapi.yaml#/components/schemas/Timestamp'
