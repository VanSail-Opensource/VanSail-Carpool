AffiliateRewardKind:
  type: string
  enum: [none, coupon, txb, subscription_extension]
AffiliateNoReward:
  type: object
  additionalProperties: false
  required: [kind]
  properties: { kind: { type: string, const: none } }
AffiliateCouponReward:
  type: object
  additionalProperties: false
  required: [kind, couponId]
  properties:
    kind: { type: string, const: coupon }
    couponId: { $ref: './schemas-01.yaml#/ID' }
    couponName: { type: string }
AffiliateTXBReward:
  type: object
  additionalProperties: false
  required: [kind, txbMinor]
  properties:
    kind: { type: string, const: txb }
    txbMinor: { type: integer, format: int64, minimum: 1, maximum: 100000000000 }
AffiliateExtensionReward:
  type: object
  additionalProperties: false
  required: [kind, extensionDays]
  properties:
    kind: { type: string, const: subscription_extension }
    extensionDays: { type: integer, minimum: 1, maximum: 3650 }
AffiliateReward:
  oneOf:
    - { $ref: '#/AffiliateNoReward' }
    - { $ref: '#/AffiliateCouponReward' }
    - { $ref: '#/AffiliateTXBReward' }
    - { $ref: '#/AffiliateExtensionReward' }
  discriminator:
    propertyName: kind
    mapping:
      none: '#/AffiliateNoReward'
      coupon: '#/AffiliateCouponReward'
      txb: '#/AffiliateTXBReward'
      subscription_extension: '#/AffiliateExtensionReward'
AffiliateTier:
  type: object
  additionalProperties: false
  required: [id, name, threshold, enabled, commissionEnabled, commissionBps, reward]
  properties:
    id: { type: string }
    name: { type: string, minLength: 1, maxLength: 48 }
    threshold: { type: integer, minimum: 0 }
    enabled: { type: boolean }
    commissionEnabled: { type: boolean }
    commissionBps: { type: integer, minimum: 0, maximum: 10000 }
    reward: { $ref: '#/AffiliateReward' }
AffiliateTierProgress:
  type: object
  additionalProperties: false
  required: [current, successful, remaining, topTier]
  properties:
    current: { $ref: '#/AffiliateTier' }
    next: { $ref: '#/AffiliateTier' }
    successful: { type: integer, minimum: 0 }
    remaining: { type: integer, minimum: 0 }
    topTier: { type: boolean }
AffiliateOverview:
  type: object
  additionalProperties: false
  required: [totalCommission, registeredCount, successfulCount, conversionBps, tierProgress]
  properties:
    inviteLink: { type: string, format: uri }
    totalCommission: { $ref: './schemas-02.yaml#/Money' }
    registeredCount: { type: integer, minimum: 0 }
    successfulCount: { type: integer, minimum: 0 }
    conversionBps: { type: integer, minimum: 0, maximum: 10000 }
    tierProgress: { $ref: '#/AffiliateTierProgress' }
AffiliateReferralStatus:
  type: string
  enum: [pending, successful]
AffiliateReferral:
  type: object
  additionalProperties: false
  required: [firstName, lastName, registeredAt, status]
  properties:
    firstName: { type: string }
    lastName: { type: string }
    registeredAt: { $ref: './schemas-01.yaml#/Timestamp' }
    status: { $ref: '#/AffiliateReferralStatus' }
    paybackAt: { $ref: './schemas-01.yaml#/Timestamp' }
    commissionAmount: { $ref: './schemas-02.yaml#/Money' }
AffiliateReferralPage:
  type: object
  additionalProperties: false
  required: [items, page, pageSize, total, totalPages]
  properties:
    items: { type: array, maxItems: 5, items: { $ref: '#/AffiliateReferral' } }
    page: { type: integer, minimum: 1 }
    pageSize: { type: integer, const: 5 }
    total: { type: integer, minimum: 0 }
    totalPages: { type: integer, minimum: 0 }
AffiliateBotIdentity:
  type: object
  additionalProperties: false
  required: [status]
  properties:
    username: { type: string }
    status: { type: string, enum: [unresolved, unavailable, ready, stale] }
    checkedAt: { $ref: './schemas-01.yaml#/Timestamp' }
AdminAffiliateView:
  type: object
  additionalProperties: false
  required: [version, bot, tiers]
  properties:
    version: { type: integer, minimum: 1 }
    bot: { $ref: '#/AffiliateBotIdentity' }
    tiers: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/AffiliateTier' } }
AffiliateConfigWrite:
  type: object
  additionalProperties: false
  required: [expectedVersion, tiers]
  properties:
    expectedVersion: { type: integer, minimum: 1 }
    tiers: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/AffiliateTier' } }
