DatabaseFilter:
  type: object
  additionalProperties: false
  required: [column, operator]
  properties:
    column:
      type: string
      pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
    operator:
      $ref: '../../openapi.yaml#/components/schemas/DatabaseFilterOperator'
    value:
      $ref: '../../openapi.yaml#/components/schemas/DatabaseValue'

DatabaseQueryRequest:
  type: object
  additionalProperties: false
  required: [filters]
  properties:
    search:
      type: string
      maxLength: 200
    filters:
      type: array
      maxItems: 5
      items: { $ref: '../../openapi.yaml#/components/schemas/DatabaseFilter' }
    cursor:
      type: string
      description: Sealed continuation cursor bound to the table, search, and filters.
    limit:
      type: integer
      minimum: 1
      maximum: 200
      default: 50

DatabaseMutationAction:
  type: string
  enum: [insert, update, delete]

DatabaseMutationReviewRequest:
  type: object
  additionalProperties: false
  required: [action, table, reason]
  properties:
    action:
      $ref: '../../openapi.yaml#/components/schemas/DatabaseMutationAction'
    table:
      type: string
      pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
    key:
      $ref: '../../openapi.yaml#/components/schemas/DatabaseKey'
    values:
      $ref: '../../openapi.yaml#/components/schemas/DatabaseValues'
    recordHash:
      type: string
    reason:
      type: string
      minLength: 4
      maxLength: 500

DatabaseMutationApplyRequest:
  type: object
  additionalProperties: false
  required: [action, table, reason, reviewHash, confirmation]
  properties:
    action:
      $ref: '../../openapi.yaml#/components/schemas/DatabaseMutationAction'
    table:
      type: string
      pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
    key:
      $ref: '../../openapi.yaml#/components/schemas/DatabaseKey'
    values:
      $ref: '../../openapi.yaml#/components/schemas/DatabaseValues'
    recordHash:
      type: string
    reason:
      type: string
      minLength: 4
      maxLength: 500
    reviewHash:
      type: string
      minLength: 32
    confirmation:
      type: string
      minLength: 1

DatabaseMutationReview:
  type: object
  additionalProperties: false
  required: [action, table, changedColumns, reviewHash, requiredConfirmation, rescueBackupRequired, warning]
  properties:
    action:
      $ref: '../../openapi.yaml#/components/schemas/DatabaseMutationAction'
    table:
      type: string
    key:
      $ref: '../../openapi.yaml#/components/schemas/DatabaseKey'
    before:
      $ref: '../../openapi.yaml#/components/schemas/DatabaseValues'
    after:
      $ref: '../../openapi.yaml#/components/schemas/DatabaseValues'
    changedColumns:
      type: array
      items:
        type: string
    reviewHash:
      type: string
    requiredConfirmation:
      type: string
      description: Exact phrase the administrator must type, such as `EDIT users`.
    rescueBackupRequired:
      type: boolean
      const: true
    warning:
      type: string

DatabaseMutationResult:
  type: object
  additionalProperties: false
  required: [deleted, rescueBackupId]
  properties:
    row:
      $ref: '../../openapi.yaml#/components/schemas/DatabaseRow'
    deleted:
      type: boolean
    rescueBackupId:
      $ref: '../../openapi.yaml#/components/schemas/ID'

BackupRun:
  type: object
  additionalProperties: false
  required: [id, path, sizeBytes, status, error, createdAt, completedAt]
  properties:
    id:
      $ref: '../../openapi.yaml#/components/schemas/ID'
    path:
      type: string
    sizeBytes:
      type: string
      pattern: '^\d+$'
    status:
      type: string
      enum: [running, complete, failed]
    error:
      type: string
    createdAt:
      $ref: '../../openapi.yaml#/components/schemas/Timestamp'
    completedAt:
      type: [string, 'null']
      format: date-time

JobStatus:
  type: string
  enum: [pending, processing, done, failed]

Job:
  type: object
  additionalProperties: false
  required: [id, kind, payload, status, attempts, availableAt, lastError, createdAt, updatedAt]
  properties:
    id:
      $ref: '../../openapi.yaml#/components/schemas/ID'
    kind:
      type: string
    payload:
      type: string
      description: JSON command payload; provider credentials and bearer URLs are never included.
    status:
      $ref: '../../openapi.yaml#/components/schemas/JobStatus'
    attempts:
      type: integer
      minimum: 0
    availableAt:
      $ref: '../../openapi.yaml#/components/schemas/Timestamp'
    lastError:
      type: string
      description: Redacted operator-safe error summary.
    createdAt:
      $ref: '../../openapi.yaml#/components/schemas/Timestamp'
    updatedAt:
      $ref: '../../openapi.yaml#/components/schemas/Timestamp'

JobPage:
  type: object
  additionalProperties: false
  required: [items, page]
  properties:
    items:
      type: array
      items:
        $ref: '../../openapi.yaml#/components/schemas/Job'
    page:
      $ref: '../../openapi.yaml#/components/schemas/PageInfo'
