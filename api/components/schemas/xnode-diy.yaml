XNodeDIYField:
  type: object
  additionalProperties: false
  required: [key, group, kind, minimum, maximum, unit, advanced]
  properties:
    key: {type: string}
    group: {type: string}
    kind: {type: string, enum: [boolean, integer, enum-number, enum, string, strings, range, headers, sockets, fast-open]}
    minimum: {type: integer}
    maximum: {type: integer}
    enum: {type: array, items: {type: string}}
    unit: {type: string}
    advanced: {type: boolean}
    restrictions: {type: array, items: {type: string}}
    context: {type: string}
    available: {type: boolean}
    dependencies:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [key]
        properties:
          key: {type: string}
          values: {type: array, items: {type: string}}
          notValues: {type: array, items: {type: string}}
          inheritedValues: {type: array, items: {type: string}}
XNodeTuningApplicability:
  type: object
  additionalProperties: false
  required: [key, format, state, appliedHosts, incompatibleHosts, reasons]
  properties:
    key: {type: string}
    format: {type: string}
    state: {type: string, enum: [inherited, applied, unsupported, endpoint-incompatible]}
    appliedHosts: {type: integer, minimum: 0}
    incompatibleHosts: {type: integer, minimum: 0}
    reasons: {type: array, items: {type: string}}
    restrictions: {type: array, items: {type: string}}
XNodeDIYWrite:
  type: object
  additionalProperties: false
  required: [settingsRevision, routingRevision, overrides, choices]
  properties:
    quote: {type: string, maxLength: 16384}
    whitelist: {$ref: '#/XNodeWhitelistPolicy'}
    splitProfiles: {type: array, maxItems: 64, items: {$ref: '#/XNodeSplitProfile'}}
    settingsRevision: {type: integer, minimum: 0, maximum: 9007199254740990}
    routingRevision: {type: integer, minimum: 0, maximum: 9007199254740991}
    overrides: {$ref: '../../openapi.yaml#/components/schemas/XNodeDIYOverrides'}
    choices:
      type: array
      maxItems: 64
      items: {$ref: '../../openapi.yaml#/components/schemas/XNodeRoutingChoice'}
XNodeDIYView:
  type: object
  additionalProperties: false
  required: [settingsRevision, overrides, routing, fields, compatibility, splitProfiles, splitHosts, billing]
  properties:
    billing: {$ref: '#/XNodeDIYBillingQuote'}
    splitHosts: {type: array, items: {$ref: '#/XNodeDIYSplitHost'}}
    whitelist: {$ref: '#/XNodeWhitelistView'}
    splitProfiles: {type: array, items: {$ref: '#/XNodeSplitProfile'}}
    settingsRevision: {type: integer, minimum: 0}
    overrides: {$ref: '../../openapi.yaml#/components/schemas/XNodeDIYOverrides'}
    routing: {$ref: '../../openapi.yaml#/components/schemas/XNodeRoutingView'}
    fields: {type: array, items: {$ref: '#/XNodeDIYField'}}
    compatibility: {type: array, items: {$ref: '#/XNodeTuningApplicability'}}
XNodeDIYPreview:
  type: object
  additionalProperties: false
  required: [valid, fieldErrors, paths, compatibility, billing]
  properties:
    billing: {$ref: '#/XNodeDIYBillingQuote'}
    valid: {type: boolean}
    fieldErrors: {type: object, additionalProperties: {type: string}}
    paths: {type: array, items: {$ref: '../../openapi.yaml#/components/schemas/XNodeRoutingPath'}}
    compatibility: {type: array, items: {$ref: '#/XNodeTuningApplicability'}}
XNodeDIYSaveResult:
  type: object
  additionalProperties: false
  required: [settingsRevision, routingChanged, receipt, changed]
  properties:
    changed: {type: boolean}
    billing: {$ref: '#/XNodeDIYBillingQuote'}
    deploymentChanged: {type: boolean}
    settingsRevision: {type: integer, minimum: 0}
    routingChanged: {type: boolean}
    receipt: {$ref: '../../openapi.yaml#/components/schemas/OperationReceipt'}

XNodeWhitelistPolicy:
  type: object
  additionalProperties: false
  required: [enabled, ips]
  properties:
    enabled: {type: boolean}
    ips: {type: array, maxItems: 1000, uniqueItems: true, items: {type: string}}
XNodeWhitelistView:
  type: object
  additionalProperties: false
  required: [enabled, ips, quota, phase, pendingNodes]
  properties:
    enabled: {type: boolean}
    ips: {type: array, items: {type: string}}
    quota: {type: integer, minimum: 0, maximum: 1000}
    phase: {type: string, enum: [disabled, inactive, pending, active]}
    pendingNodes: {type: array, items: {type: string}}
XNodeSplitProfile:
  type: object
  additionalProperties: false
  required: [id, uploadEndpointId, downloadEndpointId, mode]
  properties:
    id: {type: string}
    uploadEndpointId: {type: string}
    downloadEndpointId: {type: string}
    mode: {type: string, enum: [auto, packet-up, stream-up]}

XNodeDIYSplitHost:
  type: object
  additionalProperties: false
  required: [id, name, nodeId, inboundTag, downloadIds, modes]
  properties:
    id: {type: string}
    name: {type: string}
    nodeId: {type: string}
    inboundTag: {type: string}
    downloadIds: {type: array, items: {type: string}}
    modes: {type: array, items: {type: string, enum: [auto, packet-up, stream-up]}}
    downloadOptions:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [downloadEndpointId, modes]
        properties:
          downloadEndpointId: {type: string}
          modes: {type: array, items: {type: string, enum: [auto, packet-up, stream-up]}}
XNodeDIYBillingQuote:
  type: object
  additionalProperties: false
  required: [available, changed, useQuota, remaining, charge, token, expiresAt]
  properties:
    available: {type: boolean}
    changed: {type: boolean}
    useQuota: {type: boolean}
    remaining: {type: integer, minimum: 0}
    charge: {$ref: '../../openapi.yaml#/components/schemas/Money'}
    token: {type: string}
    expiresAt: {type: integer}
    purchaseId: {type: string}
    configHash: {type: string}
