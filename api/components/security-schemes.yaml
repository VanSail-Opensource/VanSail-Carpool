panelApiToken:
  type: http
  scheme: bearer
  bearerFormat: vsc_ followed by 43 base64url characters
  description: Scoped administrator API token. Use Authorization Bearer without browser cookies or HMAC headers. Token creation/revocation requires a signed browser session. Write scopes include read access; migration and X-Node scopes do not grant commerce or system administration.

cookieSession:
  type: apiKey
  in: cookie
  name: txc_session
  description: Opaque seven-day session created only by validated Telegram Mini App init data.

browserSession:
  type: apiKey
  in: cookie
  name: txc_admin_session
  description: Independent browser-admin session with rolling 30-day inactivity expiry; txc_admin_request_key signs requests.

requestTimestamp:
  type: apiKey
  in: header
  name: X-TXC-Timestamp
  description: Unix seconds covered by the request HMAC and accepted within five minutes of server time.

requestNonce:
  type: apiKey
  in: header
  name: X-TXC-Nonce
  description: Fresh 22-to-64-character unpadded base64url nonce covered by the request HMAC.

requestSignature:
  type: apiKey
  in: header
  name: X-TXC-Signature
  description: Lowercase hexadecimal HMAC-SHA256 over method, escaped path and raw query, timestamp, nonce, and exact body digest.
