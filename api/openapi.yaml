openapi: 3.1.0
info: { title: VanSail Carpool API, version: 1.0.0, description: "HTTP contract for the VanSail Carpool member Mini App and independent browser administrator console. Member endpoints use Mini App sessions. Administrator endpoints accept scoped Authorization Bearer API tokens or browser-scoped cookies established by a five-minute, single-use Mini App administrator handoff. Token management itself requires the signed browser session. API tokens do not authenticate member, browser-login, Mini App handoff, subscription-bearer, or agent-enrollment endpoints. Scopes distinguish full administration, X-Node configuration, and migration; write scope includes read access within that resource. Browser sessions have rolling 30-day inactivity expiry and independent device sessions. The restricted admin-access endpoints permit either scope; shared me and display-currency browser clients send X-TXC-Session-Scope: browser. Every authenticated browser request also carries a five-minute HMAC timestamp, unique nonce, and signature derived from a same-origin companion key. Provider callbacks use provider-specific signatures and are never authenticated by the browser session. All identifiers and timestamps are strings. TXB values use integer hundredths encoded as decimal strings. Traffic byte counts are decimal strings. The server is authoritative for prices, exchange rates, entitlement dates, and payment state.", license: { name: Proprietary } }
security: [{ cookieSession: [], requestTimestamp: [], requestNonce: [], requestSignature: [] }]
