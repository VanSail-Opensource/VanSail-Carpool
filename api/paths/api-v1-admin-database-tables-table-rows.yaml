get:
  security: [{"browserSession":[],"requestTimestamp":[],"requestNonce":[],"requestSignature":[]},{"panelApiToken":[]}]
  tags: [Admin, Database Administration]
  operationId: listAdminDatabaseRows
  summary: Page typed rows by declared primary key
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/DatabaseTableName'
    - $ref: '../openapi.yaml#/components/parameters/Cursor'
    - $ref: '../openapi.yaml#/components/parameters/DatabasePageLimit'
  responses:
    '200':
      description: Typed rows with optimistic hashes and a continuation cursor.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/DatabaseRowPage'
    '400': { $ref: '../openapi.yaml#/components/responses/BadRequest' }
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
    '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
    '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
