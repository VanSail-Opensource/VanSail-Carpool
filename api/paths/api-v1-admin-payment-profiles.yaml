get:
  security: [{ browserSession: [], requestTimestamp: [], requestNonce: [], requestSignature: [] }]
  tags: [Admin]
  operationId: listAdminPaymentProfiles
  responses:
    '200':
      description: Masked provider payment profiles with independently enabled channels.
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items:
                type: array
                items: { $ref: '../openapi.yaml#/components/schemas/PaymentProfile' }
    '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
post:
  security: [{ browserSession: [], requestTimestamp: [], requestNonce: [], requestSignature: [] }]
  tags: [Admin]
  operationId: createAdminPaymentProfile
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: '../openapi.yaml#/components/schemas/PaymentProfileWrite' }
  responses:
    '201':
      description: Created masked payment profile.
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/PaymentProfile' }
    '400': { $ref: '../openapi.yaml#/components/responses/BadRequest' }
    '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
    '422': { $ref: '../openapi.yaml#/components/responses/Unprocessable' }
