get:
  tags: [Catalog]
  operationId: getCatalog
  summary: List visible catalog definitions and add-on squads
  responses:
    '200':
      description: Current visible definitions for catalog display, owned-term renewal and available add-on selections. New fixed-term purchase creation is closed; each supported quote or commit revalidates its current terms.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/Catalog'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '500':
      $ref: '../openapi.yaml#/components/responses/InternalFailure'
