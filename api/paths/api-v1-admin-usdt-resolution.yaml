parameters:
  - { name: id, in: path, required: true, schema: { type: string, pattern: '^[a-f0-9]{64}$' } }
put:
  security: [{"browserSession":[],"requestTimestamp":[],"requestNonce":[],"requestSignature":[]},{"panelApiToken":[]}]
  tags: [USDT]
  operationId: resolveAdminUSDTTransfer
  description: Settles verified same-token/network/address evidence once, or permanently dismisses review evidence with actor/reason/time audit. Only the original payment window may be overridden; dismissed and credited evidence is immutable.
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: '../openapi.yaml#/components/schemas/USDTResolutionRequest' }
  responses:
    '200':
      description: Audited settlement, permanent dismissal, or an idempotent replay
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/USDTResolution' }
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
    '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
    '409': { $ref: '../openapi.yaml#/components/responses/Conflict' }
    '422': { $ref: '../openapi.yaml#/components/responses/Unprocessable' }
