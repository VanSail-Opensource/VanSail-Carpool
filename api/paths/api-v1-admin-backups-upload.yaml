post:
  security: [{ browserSession: [], requestTimestamp: [], requestNonce: [], requestSignature: [] }]
  tags: [Admin, Database Administration]
  operationId: uploadAdminBackup
  summary: Stream, hash, validate, and stage a database backup candidate
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/IdempotencyKey'
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          required: [file]
          properties:
            file: { type: string, format: binary }
            sha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
  responses:
    '201':
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/BackupRun' }
    '400': { $ref: '../openapi.yaml#/components/responses/BadRequest' }
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
    '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
    '409': { $ref: '../openapi.yaml#/components/responses/Conflict' }
    '413': { $ref: '../openapi.yaml#/components/responses/PayloadTooLarge' }
    '422': { $ref: '../openapi.yaml#/components/responses/Unprocessable' }
    '500': { $ref: '../openapi.yaml#/components/responses/InternalFailure' }
