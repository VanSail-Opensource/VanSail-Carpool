get:
  security: [{ browserSession: [], requestTimestamp: [], requestNonce: [], requestSignature: [] }]
  tags: [Admin, Questionnaires]
  operationId: listAdminQuestionnaires
  summary: List questionnaire definitions and settlement state
  responses:
    '200':
      description: Questionnaire definitions.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/QuestionnaireList'
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
    '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
    '500': { $ref: '../openapi.yaml#/components/responses/InternalFailure' }
post:
  security: [{ browserSession: [], requestTimestamp: [], requestNonce: [], requestSignature: [] }]
  tags: [Admin, Questionnaires]
  operationId: createAdminQuestionnaire
  summary: Create a Google or Microsoft Forms questionnaire
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/QuestionnaireWrite'
  responses:
    '201':
      description: Created questionnaire.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/Questionnaire'
    '400': { $ref: '../openapi.yaml#/components/responses/BadRequest' }
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
    '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
    '409': { $ref: '../openapi.yaml#/components/responses/Conflict' }
    '422': { $ref: '../openapi.yaml#/components/responses/Unprocessable' }
    '500': { $ref: '../openapi.yaml#/components/responses/InternalFailure' }
