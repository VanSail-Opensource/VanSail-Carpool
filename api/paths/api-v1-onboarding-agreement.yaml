post:
  tags: [Onboarding]
  operationId: acceptSharingAgreement
  summary: Accept the current published agreements and complete local onboarding
  description: |
    Requires the current positive agreement revision and exact unique set of
    published agreement IDs while the account is at the agreement step.
    Records acceptance and completes local onboarding. Durable background work
    provisions native subscription credentials and applicable PAYG access.
    Traffic admission still follows the current entitlement and PAYG policy;
    this response does not establish deployment completion or node liveness.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/AgreementRequest'
  responses:
    '200':
      description: Agreement accepted and onboarding complete.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/AuthState'
    '400':
      $ref: '../openapi.yaml#/components/responses/BadRequest'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '409':
      $ref: '../openapi.yaml#/components/responses/Conflict'
    '502':
      $ref: '../openapi.yaml#/components/responses/UpstreamFailure'
