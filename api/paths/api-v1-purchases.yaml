get:
  tags: [Catalog]
  operationId: listPurchases
  summary: List the current user's purchase history
  responses:
    '200':
      description: Purchases newest first.
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items:
                type: array
                items:
                  $ref: '../openapi.yaml#/components/schemas/Purchase'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '500':
      $ref: '../openapi.yaml#/components/responses/InternalFailure'
post:
  tags: [Catalog]
  operationId: createPurchase
  summary: Replay a historical fixed-term checkout
  description: |
    New fixed-term sales are closed. An exact owner-scoped historical request
    returns its original purchase without another debit. Owned renewal and
    internal reward entry points remain separate.
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/IdempotencyKey'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/PurchaseRequest'
  responses:
    '201':
      description: Original immutable purchase returned without another debit.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/Purchase'
    '400':
      $ref: '../openapi.yaml#/components/responses/BadRequest'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '404':
      $ref: '../openapi.yaml#/components/responses/NotFound'
    '409':
      description: Insufficient balance, outstanding debt, stale catalog choice, or incompatible queued change.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiError'

    '410':
      description: New fixed-term sales are closed (LEGACY_PURCHASE_CLOSED).
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/ApiError' }
