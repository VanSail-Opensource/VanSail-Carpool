get:
  security: [{ browserSession: [], requestTimestamp: [], requestNonce: [], requestSignature: [] }]
  tags: [Admin, Coupons]
  operationId: listAdminCoupons
  summary: List active and inactive coupon definitions
  responses:
    '200':
      description: Coupon definitions.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/CouponList'
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
    '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
post:
  security: [{ browserSession: [], requestTimestamp: [], requestNonce: [], requestSignature: [] }]
  tags: [Admin, Coupons]
  operationId: createAdminCoupon
  summary: Create a coupon definition
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/CouponWrite'
  responses:
    '201':
      description: Created coupon.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/Coupon'
    '400': { $ref: '../openapi.yaml#/components/responses/BadRequest' }
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
    '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
    '409': { $ref: '../openapi.yaml#/components/responses/Conflict' }
    '422': { $ref: '../openapi.yaml#/components/responses/Unprocessable' }
