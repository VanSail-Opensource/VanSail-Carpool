get:
  security: [{ browserSession: [], requestTimestamp: [], requestNonce: [], requestSignature: [] }]
  tags: [IP Lookup]
  operationId: getAdminIPLookupProxySources
  responses:
    "200":
      description: Shared proxy source cache status
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/IPLookupProxySourcesStatus
    "401":
      $ref: ../openapi.yaml#/components/responses/Unauthorized
    "403":
      $ref: ../openapi.yaml#/components/responses/Forbidden
    "422":
      $ref: ../openapi.yaml#/components/responses/Unprocessable
    "502":
      $ref: ../openapi.yaml#/components/responses/UpstreamFailure
