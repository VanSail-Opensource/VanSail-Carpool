get:
  security: [{ browserSession: [], requestTimestamp: [], requestNonce: [], requestSignature: [] }]
  tags: [Admin, Billing]
  operationId: getBillingAmountLimits
  responses:
    '200':
      description: Global inclusive Add TXB bounds without member wallet state
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/BillingAmountLimits' }
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
    '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
put:
  security: [{ browserSession: [], requestTimestamp: [], requestNonce: [], requestSignature: [] }]
  tags: [Admin, Billing]
  operationId: updateBillingAmountLimits
  summary: Atomically update the global inclusive Add TXB bounds
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: '../openapi.yaml#/components/schemas/BillingAmountLimitsWrite' }
  responses:
    '200':
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/BillingAmountLimits' }
    '400': { $ref: '../openapi.yaml#/components/responses/BadRequest' }
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
    '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
    '409': { $ref: '../openapi.yaml#/components/responses/Conflict' }
    '422': { $ref: '../openapi.yaml#/components/responses/Unprocessable' }
