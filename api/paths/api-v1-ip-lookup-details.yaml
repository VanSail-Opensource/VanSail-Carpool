get:
  security: [{ cookieSession: [], requestTimestamp: [], requestNonce: [], requestSignature: [] }, { browserSession: [], requestTimestamp: [], requestNonce: [], requestSignature: [] }]
  tags: [IP Lookup]
  operationId: getIPLookupLiveDetails
  parameters:
    - in: query
      name: ip
      required: true
      schema: { type: string }
      description: Requested public IPv4 or IPv6 address. sourceIP identifies the actual cached observation address.
    - in: query
      name: refresh
      schema: { type: boolean, default: false }
      description: Deprecated. true is rejected; use a signed paid refresh through quote/checks.
  responses:
    "200":
      description: Source-attributed persistent cache (exact IP, then IPv4 /24), or a free first fetch. Accept text/event-stream for progressive section snapshots and final completion.
      headers:
        Cache-Control: { schema: { type: string }, description: Always no-store. }
      content:
        application/json:
          schema: { $ref: ../openapi.yaml#/components/schemas/IPLookupLiveDetails }
        text/event-stream:
          schema: { $ref: ../openapi.yaml#/components/schemas/IPLookupLiveEvent }
    "401": { $ref: ../openapi.yaml#/components/responses/Unauthorized }
    "409": { $ref: ../openapi.yaml#/components/responses/Conflict }
    "422": { $ref: ../openapi.yaml#/components/responses/Unprocessable }
    "429":
      description: Six requests per minute or admission capacity exceeded.
      headers:
        Retry-After: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: ../openapi.yaml#/components/schemas/ApiError }
    "502": { $ref: ../openapi.yaml#/components/responses/UpstreamFailure }
