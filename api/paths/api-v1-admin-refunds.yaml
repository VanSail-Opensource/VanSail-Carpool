get:
  security: [{"browserSession":[],"requestTimestamp":[],"requestNonce":[],"requestSignature":[]},{"panelApiToken":[]}]
  tags: [Admin]
  operationId: listAdminRefunds
  summary: List immutable refund records
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/Cursor'
    - $ref: '../openapi.yaml#/components/parameters/AdminPageLimit'
    - $ref: '../openapi.yaml#/components/parameters/Search'
    - name: status
      in: query
      schema: { type: string, enum: [completed] }
  responses:
    '200':
      description: Refund page.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/RefundPage'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '403':
      $ref: '../openapi.yaml#/components/responses/Forbidden'
    '400':
      $ref: '../openapi.yaml#/components/responses/BadRequest'
    '422':
      $ref: '../openapi.yaml#/components/responses/Unprocessable'
