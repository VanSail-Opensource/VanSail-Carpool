get:
  security: [{ browserSession: [], requestTimestamp: [], requestNonce: [], requestSignature: [] }]
  tags: [Admin]
  operationId: getAdminHostConnectivity
  summary: Read connectivity progress and latest retained host results
  description: Administrator-only. Safe host metadata is transient; proxy credentials are never returned. Results are restricted to the rolling 24-hour window.
  responses:
    '200':
      description: Configuration, progress, freshness and safe results.
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/ConnectivitySnapshot' }
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
    '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
    '503': { $ref: '../openapi.yaml#/components/responses/ServiceUnavailable' }
