get:
  tags: [Billing]
  operationId: returnFromPaymentProviderWithOrder
  summary: Navigate back to a specific Mini App payment order
  description: Forwards an existing valid checkout-issued capability unchanged to the same-origin result page. Missing, expired and legacy capabilities require owner authentication there. This public navigation route never issues a capability or changes payment state.
  security: []
  parameters:
    - name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [ezpay, bepusdt]
    - name: orderID
      in: path
      required: true
      schema:
        $ref: '../openapi.yaml#/components/schemas/ID'
    - name: capability
      in: query
      required: false
      description: Existing checkout-issued receipt capability; navigation never renews it.
      schema:
        type: string
        pattern: '^v2\.[0-9]+\.[a-f0-9]{64}$'
  responses:
    '303':
      description: Redirect to the same-origin payment result route.
      headers:
        Location:
          required: true
          schema:
            type: string
