get:
  security: [{browserSession: [], requestTimestamp: [], requestNonce: [], requestSignature: []}, {panelApiToken: []}]
  tags: [Dashboard]
  operationId: getStatistics
  summary: Get the latest 30-minute aggregate statistics snapshot
  responses:
    '200':
      description: Current member usage projection and freshness information.
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/StatisticsSnapshot' }
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
