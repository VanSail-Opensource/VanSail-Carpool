post:
  security: [{"browserSession":[],"requestTimestamp":[],"requestNonce":[],"requestSignature":[]},{"panelApiToken":[]}]
  tags: [Admin, Database Administration]
  operationId: runAdminMaintenance
  summary: Queue a complete maintenance run now
  description: Creates and verifies a backup before database retention cleanup and migration-snapshot pruning. Manual commands may run again on the same local date.
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/IdempotencyKey'
  responses:
    '202':
      description: Durable maintenance command queued or replayed.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/OperationReceipt'
    '400':
      $ref: '../openapi.yaml#/components/responses/BadRequest'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '403':
      $ref: '../openapi.yaml#/components/responses/Forbidden'
    '409':
      $ref: '../openapi.yaml#/components/responses/Conflict'
