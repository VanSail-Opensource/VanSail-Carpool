{
  "get": {
    "tags": [
      "Pricing"
    ],
    "operationId": "getPricingHealth",
    "summary": "Read memory-only pricing health without analytical queries",
    "security": [
      {
        "browserSession": [],
        "requestTimestamp": [],
        "requestNonce": [],
        "requestSignature": []
      },
      {
        "panelApiToken": []
      }
    ],
    "responses": {
      "200": {
        "description": "Current transient pricing health.",
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "properties": {
                "health": {
                  "type": "array",
                  "items": {
                    "$ref": "../openapi.yaml#/components/schemas/PricingHealth"
                  }
                },
                "observedAt": {
                  "type": "string",
                  "format": "date-time"
                }
              },
              "required": [
                "health",
                "observedAt"
              ]
            }
          }
        }
      },
      "401": {
        "$ref": "../openapi.yaml#/components/responses/Unauthorized"
      },
      "403": {
        "$ref": "../openapi.yaml#/components/responses/Forbidden"
      }
    }
  }
}
