post:
  security: [{ browserSession: [], requestTimestamp: [], requestNonce: [], requestSignature: [] }]
  tags: [Admin]
  operationId: removeAdminUserTemporaryBan
  summary: Queue immediate restoration of one manual temporary ban
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/UserID'
    - $ref: '../openapi.yaml#/components/parameters/IdempotencyKey'
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: '../openapi.yaml#/components/schemas/ReasonRequest' }
  responses:
    '202': { content: { application/json: { schema: { $ref: '../openapi.yaml#/components/schemas/OperationReceipt' } } } }
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
    '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
    '409': { $ref: '../openapi.yaml#/components/responses/Conflict' }
