get:
  security: [{"browserSession":[],"requestTimestamp":[],"requestNonce":[],"requestSignature":[]},{"panelApiToken":[]}]
  tags: [Admin]
  operationId: listAdminEntitlements
  summary: List active, queued, and historical entitlements
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/Cursor'
    - $ref: '../openapi.yaml#/components/parameters/AdminPageLimit'
    - $ref: '../openapi.yaml#/components/parameters/Search'
    - name: status
      in: query
      description: >-
        Filters display validity at the current UTC time. Active, activating and queued
        terms whose validUntil has been reached match expired; future active or activating
        terms match queued. Terminal statuses are preserved. Response status remains the
        stored lifecycle state used by settlement and advanced editing.
      schema: { $ref: '../openapi.yaml#/components/schemas/EntitlementStatus' }
  responses:
    '200':
      description: Entitlement page.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/EntitlementPage'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '403':
      $ref: '../openapi.yaml#/components/responses/Forbidden'
    '400':
      $ref: '../openapi.yaml#/components/responses/BadRequest'
    '422':
      $ref: '../openapi.yaml#/components/responses/Unprocessable'
