get:
  security: [{"browserSession":[],"requestTimestamp":[],"requestNonce":[],"requestSignature":[]},{"panelApiToken":[]}]
  tags: [Admin]
  operationId: listAdminUsers
  summary: List users through safe projections
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/Cursor'
    - $ref: '../openapi.yaml#/components/parameters/AdminPageLimit'
    - $ref: '../openapi.yaml#/components/parameters/Search'
    - name: state
      in: query
      schema: { type: string, enum: [active, non_active] }
    - name: comboId
      in: query
      style: form
      explode: true
      schema: { type: array, uniqueItems: true, items: { $ref: '../openapi.yaml#/components/schemas/ID' } }
    - name: squadUuid
      in: query
      style: form
      explode: true
      schema: { type: array, uniqueItems: true, items: { type: string, format: uuid } }
    - name: match
      in: query
      schema: { type: string, enum: [and, or], default: and }
  responses:
    '200':
      description: User page. Subscription bearer URLs are omitted from list results.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/AdminUserPage'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '403':
      $ref: '../openapi.yaml#/components/responses/Forbidden'
    '400':
      $ref: '../openapi.yaml#/components/responses/BadRequest'
    '422':
      $ref: '../openapi.yaml#/components/responses/Unprocessable'
