post:
  security: [{ browserSession: [], requestTimestamp: [], requestNonce: [], requestSignature: [] }]
  tags: [Admin]
  operationId: startAdminHostConnectivityCheck
  summary: Start a manual connectivity batch or return the active batch
  description: Returns immediately. Repeated requests during an active run return that same run ID. Uses saved connectivity.config settings.
  responses:
    '202':
      description: The accepted or already active batch.
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/ConnectivityRun' }
    '400': { $ref: '../openapi.yaml#/components/responses/BadRequest' }
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
    '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
    '503': { $ref: '../openapi.yaml#/components/responses/ServiceUnavailable' }
