post:
  security: [{"browserSession":[],"requestTimestamp":[],"requestNonce":[],"requestSignature":[]},{"panelApiToken":[]}]
  tags: [Admin]
  operationId: previewBulkExtension
  summary: Preview active users matched by inclusive combo/add-on filters
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: '../openapi.yaml#/components/schemas/BulkExtensionRequest' }
  responses:
    '200':
      description: Previewed member selection, term changes and confirmation version.
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/BulkExtensionPreview' }
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
    '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
