get:
  tags: [Billing]
  operationId: returnFromPaymentProvider
  summary: Navigate back to the Mini App after provider checkout
  description: Compatibility navigation using the order query parameter. Forwards only an existing valid checkout capability unchanged. It never issues or renews access; legacy returns require owner authentication. Payment state comes from verified callbacks.
  security: []
  parameters:
    - name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [ezpay, bepusdt]
  responses:
    '303':
      description: Redirect to the same-origin payment result route.
      headers:
        Location:
          required: true
          schema:
            type: string
