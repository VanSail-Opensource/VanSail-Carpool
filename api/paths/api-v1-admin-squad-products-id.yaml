put:
  security: [{"browserSession":[],"requestTimestamp":[],"requestNonce":[],"requestSignature":[]},{"panelApiToken":[]}]
  tags: [Admin]
  operationId: updateAdminSquadProduct
  summary: Set a squad product's local merchandising fields
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/ResourceID'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/SquadProductWrite'
  responses:
    '200':
      description: Updated squad product.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/SquadProduct'
    '400':
      $ref: '../openapi.yaml#/components/responses/BadRequest'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '403':
      $ref: '../openapi.yaml#/components/responses/Forbidden'
    '404':
      $ref: '../openapi.yaml#/components/responses/NotFound'
    '422':
      $ref: '../openapi.yaml#/components/responses/Unprocessable'
