get:
  security: [{ browserSession: [], requestTimestamp: [], requestNonce: [], requestSignature: [] }]
  tags:
    - IP Lookup
  operationId: getAdminIPLookup
  responses:
    "200":
      description: IP Lookup result
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/IPLookupAdminSettings
    "401":
      $ref: ../openapi.yaml#/components/responses/Unauthorized
    "409":
      $ref: ../openapi.yaml#/components/responses/Conflict
    "422":
      $ref: ../openapi.yaml#/components/responses/Unprocessable
    "502":
      $ref: ../openapi.yaml#/components/responses/UpstreamFailure
put:
  security: [{ browserSession: [], requestTimestamp: [], requestNonce: [], requestSignature: [] }]
  tags:
    - IP Lookup
  operationId: putAdminIPLookup
  responses:
    "200":
      description: IP Lookup result
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/IPLookupAdminSettings
    "401":
      $ref: ../openapi.yaml#/components/responses/Unauthorized
    "409":
      $ref: ../openapi.yaml#/components/responses/Conflict
    "422":
      $ref: ../openapi.yaml#/components/responses/Unprocessable
    "502":
      $ref: ../openapi.yaml#/components/responses/UpstreamFailure
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../openapi.yaml#/components/schemas/IPLookupAdminSettings
