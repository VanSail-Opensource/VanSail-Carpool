get:
  security: [{"browserSession":[],"requestTimestamp":[],"requestNonce":[],"requestSignature":[]},{"panelApiToken":[]}]
  tags: [Admin]
  operationId: getAdminHostConnectivityHistory
  summary: Page connectivity attempts retained for 24 hours
  parameters:
    - { name: hostUuid, in: query, schema: { type: string, format: uuid } }
    - { name: cursor, in: query, schema: { type: string, maxLength: 512 } }
    - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
  responses:
    '200':
      description: Descending attempts with a filter-bound stable cursor.
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/ConnectivityHistory' }
    '400': { $ref: '../openapi.yaml#/components/responses/BadRequest' }
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
    '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
