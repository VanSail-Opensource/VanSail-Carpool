post:
  tags: [Dashboard]
  operationId: revokeSubscription
  summary: Rotate the current X-Node subscription URL
  description: Queues durable rotation of the current native subscription credentials. Retain the same idempotency key while the outcome is uncertain, and reload the owner subscription after the receipt succeeds.
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/IdempotencyKey'
  responses:
    '202':
      description: Credential rotation queued or replayed.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/OperationReceipt'
    '400':
      $ref: '../openapi.yaml#/components/responses/BadRequest'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '409':
      $ref: '../openapi.yaml#/components/responses/Conflict'
    '502':
      $ref: '../openapi.yaml#/components/responses/UpstreamFailure'
