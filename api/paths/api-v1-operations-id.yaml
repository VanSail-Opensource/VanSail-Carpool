get:
  tags: [Operations]
  operationId: getOperation
  summary: Get an operation receipt issued by or affecting the current user
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/OperationID'
  responses:
    '200':
      description: Current durable receipt visible to the operation owner.
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/OperationReceipt' }
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
    '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
