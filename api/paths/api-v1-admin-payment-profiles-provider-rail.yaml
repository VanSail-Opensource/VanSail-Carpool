put:
  security: [{"browserSession":[],"requestTimestamp":[],"requestNonce":[],"requestSignature":[]},{"panelApiToken":[]}]
  tags: [Admin]
  operationId: updateAdminPaymentProfile
  description: Retained orders keep their provider account identity and signing credentials. Create a replacement profile and disable the old one when rotating an account still needed by those orders. Blank or masked credentials cannot be moved to a different endpoint, merchant or provider.
  parameters:
    - name: id
      in: path
      required: true
      schema: { $ref: '../openapi.yaml#/components/schemas/ID' }
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: '../openapi.yaml#/components/schemas/PaymentProfileWrite' }
  responses:
    '200':
      description: Saved masked provider profile.
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/PaymentProfile' }
    '400': { $ref: '../openapi.yaml#/components/responses/BadRequest' }
    '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
    '409':
      description: PAYMENT_PROFILE_FRESH_CREDENTIAL_REQUIRED when credentials would be inherited across an account change, or PAYMENT_PROFILE_IN_USE when retained orders still require the existing identity or credential.
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/ApiError' }
    '422': { $ref: '../openapi.yaml#/components/responses/Unprocessable' }
delete:
  security: [{"browserSession":[],"requestTimestamp":[],"requestNonce":[],"requestSignature":[]},{"panelApiToken":[]}]
  tags: [Admin]
  operationId: deleteAdminPaymentProfile
  description: A profile needed by retained orders cannot be deleted (PAYMENT_PROFILE_IN_USE). Disable it for new orders and retain it for callback and reconciliation evidence.
  parameters:
    - name: id
      in: path
      required: true
      schema: { $ref: '../openapi.yaml#/components/schemas/ID' }
  responses:
    '204': { description: Payment profile deleted. }
    '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
    '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
    '409': { $ref: '../openapi.yaml#/components/responses/Conflict' }
