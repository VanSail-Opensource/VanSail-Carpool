get:
  tags: [Dashboard]
  operationId: getMemberSubscription
  summary: Get this member's subscription links and hosts
  description: Uses local entitlement and enabled squad preferences. Returns only the requesting member's native links, including eligible PAYG and hidden hosts. Links must not be persisted by clients.
  responses:
    '200':
      description: Member subscription and accessible hosts.
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/MemberSubscription' }
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
    '409': { $ref: '../openapi.yaml#/components/responses/Conflict' }
    '502': { $ref: '../openapi.yaml#/components/responses/UpstreamFailure' }
