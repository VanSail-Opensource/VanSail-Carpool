post:
  security: [{ cookieSession: [], requestTimestamp: [], requestNonce: [], requestSignature: [] }, { browserSession: [], requestTimestamp: [], requestNonce: [], requestSignature: [] }]
  tags:
    - IP Lookup
  operationId: submitIPLookup
  responses:
    "202":
      description: IP Lookup result
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/OperationReceipt
    "401":
      $ref: ../openapi.yaml#/components/responses/Unauthorized
    "409":
      $ref: ../openapi.yaml#/components/responses/Conflict
    "422":
      $ref: ../openapi.yaml#/components/responses/Unprocessable
    "502":
      $ref: ../openapi.yaml#/components/responses/UpstreamFailure
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../openapi.yaml#/components/schemas/IPLookupQuote
  parameters:
    - name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
