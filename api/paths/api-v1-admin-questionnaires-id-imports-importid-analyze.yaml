post:
  security: [{"browserSession":[],"requestTimestamp":[],"requestNonce":[],"requestSignature":[]},{"panelApiToken":[]}]
  tags: [Admin, Questionnaires]
  operationId: analyzeQuestionnaireImport
  summary: Analyze one selected validation-code column without crediting
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/ResourceID'
    - $ref: '../openapi.yaml#/components/parameters/ImportID'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/QuestionnaireImportAnalyzeRequest'
  responses:
    '200':
      description: Matched, duplicate, unknown, malformed, and already-awarded counts.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/QuestionnaireImportAnalysis'
    '400': { $ref: '../openapi.yaml#/components/responses/BadRequest' }
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
    '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
    '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
    '409': { $ref: '../openapi.yaml#/components/responses/Conflict' }
    '422': { $ref: '../openapi.yaml#/components/responses/Unprocessable' }
    '500': { $ref: '../openapi.yaml#/components/responses/InternalFailure' }
