get:
  security: [{ browserSession: [], requestTimestamp: [], requestNonce: [], requestSignature: [] }]
  tags: [Admin]
  operationId: getAdminUser
  summary: Get aggregate user profile, entitlements, payments, refunds, and open operations
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/ResourceID'
  responses:
    '200':
      description: Domain-safe user identity without subscription bearer data.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/AdminUserDetail'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '403':
      $ref: '../openapi.yaml#/components/responses/Forbidden'
    '404':
      $ref: '../openapi.yaml#/components/responses/NotFound'
