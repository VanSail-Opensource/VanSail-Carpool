get:
  security: [{"browserSession":[],"requestTimestamp":[],"requestNonce":[],"requestSignature":[]},{"panelApiToken":[]}]
  tags: [Admin, Activity]
  operationId: getAdminLuckyDrawStatistics
  summary: Get participation, fee, reward, house-net, and prize-distribution statistics
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/ResourceID'
    - $ref: '../openapi.yaml#/components/parameters/StatisticsFrom'
    - $ref: '../openapi.yaml#/components/parameters/StatisticsTo'
    - $ref: '../openapi.yaml#/components/parameters/StatisticsBucket'
    - $ref: '../openapi.yaml#/components/parameters/StatisticsTimeZone'
  responses:
    '200':
      description: Accessible daily or weekly series and prize distribution.
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/AdminStatistics' }
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
    '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
    '422': { $ref: '../openapi.yaml#/components/responses/Unprocessable' }
