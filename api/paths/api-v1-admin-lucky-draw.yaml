get:
  security: [{ browserSession: [], requestTimestamp: [], requestNonce: [], requestSignature: [] }]
  tags: [Admin, Activity]
  operationId: listAdminLuckyDraws
  summary: List lucky draws and weighted prizes
  responses:
    '200':
      description: Enabled and disabled draw definitions.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/LuckyDrawAdminList'
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
    '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
post:
  security: [{ browserSession: [], requestTimestamp: [], requestNonce: [], requestSignature: [] }]
  tags: [Admin, Activity]
  operationId: createAdminLuckyDraw
  summary: Create a lucky draw and its typed rewards
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/LuckyDrawWrite'
  responses:
    '201':
      description: Created draw.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/LuckyDrawAdmin'
    '400': { $ref: '../openapi.yaml#/components/responses/BadRequest' }
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
    '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
    '422': { $ref: '../openapi.yaml#/components/responses/Unprocessable' }
