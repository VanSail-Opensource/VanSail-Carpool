post:
  security: [{"browserSession":[],"requestTimestamp":[],"requestNonce":[],"requestSignature":[]},{"panelApiToken":[]}]
  tags: [Admin, Questionnaires]
  operationId: settleQuestionnaireImport
  summary: Confirm the analyzed import and queue idempotent settlement
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/ResourceID'
    - $ref: '../openapi.yaml#/components/parameters/ImportID'
    - $ref: '../openapi.yaml#/components/parameters/IdempotencyKey'
  responses:
    '202':
      description: Settlement queued or replayed; poll the import resource for its report.
      content:
        application/json:
          schema:
            type: object
            required: [operation, import]
            properties:
              operation:
                $ref: '../openapi.yaml#/components/schemas/OperationReceipt'
              import:
                $ref: '../openapi.yaml#/components/schemas/QuestionnaireImportPreview'
    '400': { $ref: '../openapi.yaml#/components/responses/BadRequest' }
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
    '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
    '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
    '409': { $ref: '../openapi.yaml#/components/responses/Conflict' }
    '500': { $ref: '../openapi.yaml#/components/responses/InternalFailure' }
