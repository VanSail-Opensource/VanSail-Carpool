put:
  security: [{"browserSession":[],"requestTimestamp":[],"requestNonce":[],"requestSignature":[]},{"panelApiToken":[]}]
  tags: [Admin, Activity]
  operationId: updateAdminActivityGame
  summary: Replace a betting-game definition
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/ResourceID'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/ActivityGameWrite'
  responses:
    '200':
      description: Updated game.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ActivityGame'
    '400': { $ref: '../openapi.yaml#/components/responses/BadRequest' }
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
    '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
    '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
    '422': { $ref: '../openapi.yaml#/components/responses/Unprocessable' }
delete:
  security: [{"browserSession":[],"requestTimestamp":[],"requestNonce":[],"requestSignature":[]},{"panelApiToken":[]}]
  tags: [Admin, Activity]
  operationId: deleteAdminActivityGame
  summary: Remove a betting game from active configuration
  description: Disables the game and retains a removal tombstone, settled bets, immutable outcomes, ledger entries and original idempotency bindings. Retained evidence supports recovery and prevents removed games or old action keys from creating new bets.
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/ResourceID'
  responses:
    '204': { description: Active game configuration removed with settlement and recovery evidence retained. }
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
    '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
    '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
    '409': { $ref: '../openapi.yaml#/components/responses/Conflict' }
