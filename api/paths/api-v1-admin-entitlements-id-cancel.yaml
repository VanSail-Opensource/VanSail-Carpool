post:
  security: [{ browserSession: [], requestTimestamp: [], requestNonce: [], requestSignature: [] }]
  tags: [Admin]
  operationId: cancelAdminEntitlement
  summary: Cancel queued or active access with an audit reason
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/ResourceID'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/ReasonRequest'
  responses:
    '200':
      description: Cancellation recorded and Remnawave revocation queued.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/Purchase'
    '400':
      $ref: '../openapi.yaml#/components/responses/BadRequest'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '403':
      $ref: '../openapi.yaml#/components/responses/Forbidden'
    '404':
      $ref: '../openapi.yaml#/components/responses/NotFound'
    '409':
      $ref: '../openapi.yaml#/components/responses/Conflict'
    '422':
      $ref: '../openapi.yaml#/components/responses/Unprocessable'
