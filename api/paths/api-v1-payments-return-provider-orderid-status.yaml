parameters:
  - $ref: '../openapi.yaml#/components/parameters/BrowserSessionScope'

get:
  tags: [Billing]
  operationId: getPaymentReturnStatus
  summary: Poll a provider-return payment receipt
  description: Returns a narrow receipt projection through a checkout-issued capability expiring 30 minutes after order creation, or through the authenticated owner. Navigation cannot issue or renew capabilities. Legacy links require owner authentication. This endpoint never changes payment state or exposes owner, checkout, QR, trade, or provider payload data.
  security:
    - checkoutReturnCapability: []
    - cookieSession: []
      requestTimestamp: []
      requestNonce: []
      requestSignature: []
    - browserSession: []
      requestTimestamp: []
      requestNonce: []
      requestSignature: []
  parameters:
    - name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [ezpay, bepusdt]
    - name: orderID
      in: path
      required: true
      schema:
        $ref: '../openapi.yaml#/components/schemas/ID'
    - name: capability
      in: query
      required: false
      schema:
        type: string
        pattern: '^v2\.[0-9]+\.[a-f0-9]{64}$'
  responses:
    '200':
      description: Current durable payment receipt projection.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/PaymentReturnStatus'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '403':
      $ref: '../openapi.yaml#/components/responses/Forbidden'
    '404':
      $ref: '../openapi.yaml#/components/responses/NotFound'
    '500':
      description: Payment storage is temporarily unavailable (PAYMENT_LOAD_FAILED); this does not establish that the order is absent or unpaid.
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/ApiError' }
