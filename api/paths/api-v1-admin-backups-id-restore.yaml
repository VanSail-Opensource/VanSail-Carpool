post:
  security: [{"browserSession":[],"requestTimestamp":[],"requestNonce":[],"requestSignature":[]},{"panelApiToken":[]}]
  tags: [Admin, Database Administration]
  operationId: stageAdminRestore
  summary: Verify and stage a stored snapshot for restart-time restore
  description: Creates a rescue backup, verifies integrity and migration compatibility, stages beside the live database, writes a restore marker, and requests graceful restart.
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/IdempotencyKey'
    - $ref: '../openapi.yaml#/components/parameters/ResourceID'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/RestoreRequest'
  responses:
    '202':
      description: Restore staged; clients should reconnect, reauthenticate, and poll status.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/RestoreOperation'
    '400': { $ref: '../openapi.yaml#/components/responses/BadRequest' }
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
    '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
    '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
    '409': { $ref: '../openapi.yaml#/components/responses/Conflict' }
    '422': { $ref: '../openapi.yaml#/components/responses/Unprocessable' }
    '500': { $ref: '../openapi.yaml#/components/responses/InternalFailure' }
