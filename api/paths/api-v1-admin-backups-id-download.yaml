get:
  security: [{"browserSession":[],"requestTimestamp":[],"requestNonce":[],"requestSignature":[]},{"panelApiToken":[]}]
  tags: [Admin, Database Administration]
  operationId: downloadAdminBackup
  summary: Download an authenticated verified PostgreSQL custom archive
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/ResourceID'
  responses:
    '200':
      description: Streamed PostgreSQL custom archive.
      headers:
        Content-Disposition:
          required: true
          schema:
            type: string
            pattern: '^attachment;'
        Content-Length:
          required: true
          schema:
            type: string
            pattern: '^\d+$'
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
        X-Content-Type-Options:
          required: true
          schema:
            type: string
            const: nosniff
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
    '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
    '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
