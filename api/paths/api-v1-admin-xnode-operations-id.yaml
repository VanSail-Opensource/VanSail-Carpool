get:
  operationId: getXNodeCommandResult
  tags: [Administration]
  security: [{browserSession: [], requestTimestamp: [], requestNonce: [], requestSignature: []}, {panelApiToken: []}]
  parameters:
    - {name: id, in: path, required: true, schema: {type: string}}
  responses:
    '200':
      description: Credential-free node command receipt and bounded result
      content:
        application/json:
          schema: {$ref: '../openapi.yaml#/components/schemas/XNodeCommandResult'}
    '404': {$ref: '../openapi.yaml#/components/responses/NotFound'}
    '401': {$ref: '../openapi.yaml#/components/responses/Unauthorized'}
    '403': {$ref: '../openapi.yaml#/components/responses/Forbidden'}
