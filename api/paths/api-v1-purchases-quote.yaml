post:
  tags: [Catalog]
  operationId: quotePurchase
  deprecated: true
  summary: Closed new fixed-term quote entrance
  description: Existing purchases renew through their owned renewal controls. New hourly sales use the hourly API.
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: '../openapi.yaml#/components/schemas/PurchaseRequest' }
  responses:
    '400': { $ref: '../openapi.yaml#/components/responses/BadRequest' }
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
    '410':
      description: New fixed-term quotes are closed (LEGACY_PURCHASE_CLOSED).
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/ApiError' }
