parameters:
  - { name: id, in: path, required: true, schema: { $ref: '../openapi.yaml#/components/schemas/ID' } }
post:
  security: [{ browserSession: [], requestTimestamp: [], requestNonce: [], requestSignature: [] }]
  tags: [Admin]
  operationId: approveNodeCompensationEvent
  summary: Approve a frozen outage recipient set
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/IdempotencyKey'
  requestBody:
    required: true
    content: { application/json: { schema: { $ref: '../components/schemas/schemas-22.yaml#/NodeCompensationApproval' } } }
  responses:
    '200':
      content: { application/json: { schema: { $ref: '../components/schemas/schemas-22.yaml#/NodeCompensationEvent' } } }
    '409': { $ref: '../components/responses.yaml#/Conflict' }
    '422': { $ref: '../components/responses.yaml#/Unprocessable' }
    '403': { $ref: '../components/responses.yaml#/Forbidden' }
