delete:
  security: [{ browserSession: [], requestTimestamp: [], requestNonce: [], requestSignature: [] }]
  tags: [Admin]
  operationId: discardAdminUserCoupon
  summary: Retire one user coupon grant while retaining its history
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/UserID'
    - name: grantId
      in: path
      required: true
      schema: { $ref: '../openapi.yaml#/components/schemas/ID' }
    - $ref: '../openapi.yaml#/components/parameters/IdempotencyKey'
  responses:
    '204': { description: Grant discarded. }
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
    '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
    '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
