post:
  security: [{ browserSession: [], requestTimestamp: [], requestNonce: [], requestSignature: [] }]
  tags: [Admin, Questionnaires]
  operationId: uploadQuestionnaireImport
  summary: Upload and parse a bounded questionnaire response CSV
  description: Accepts one UTF-8 or UTF-8-BOM file, at most 5 MiB, 50000 rows, and 100 columns. Delimiter detection supports comma, semicolon, and tab.
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/ResourceID'
    - $ref: '../openapi.yaml#/components/parameters/OptionalIdempotencyKey'
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          additionalProperties: false
          required: [file]
          properties:
            file:
              type: string
              format: binary
  responses:
    '201':
      description: Parsed headers and bounded sample. A generated idempotency key is returned in headers when none was supplied.
      headers:
        Idempotency-Key:
          schema: { type: string }
        Idempotency-Key-Generated:
          schema: { type: string, enum: ['true'] }
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/QuestionnaireImportPreview'
    '400': { $ref: '../openapi.yaml#/components/responses/BadRequest' }
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
    '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
    '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
    '422': { $ref: '../openapi.yaml#/components/responses/Unprocessable' }
    '500': { $ref: '../openapi.yaml#/components/responses/InternalFailure' }
