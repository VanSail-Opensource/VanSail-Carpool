post:
  security: [{ browserSession: [], requestTimestamp: [], requestNonce: [], requestSignature: [] }]
  tags: [Admin]
  operationId: resolveAdminHostConnectivityTestUser
  summary: Resolve one exact Remnawave username to safe account identity
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required: [username]
          properties:
            username: { type: string, minLength: 1, maxLength: 100 }
  responses:
    '200':
      description: Existing active account identity; no subscription credentials.
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/ConnectivityUser' }
    '400': { $ref: '../openapi.yaml#/components/responses/BadRequest' }
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
    '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
    '503': { $ref: '../openapi.yaml#/components/responses/ServiceUnavailable' }
