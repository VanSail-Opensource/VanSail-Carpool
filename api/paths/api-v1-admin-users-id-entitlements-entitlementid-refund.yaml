get:
  security: [{"browserSession":[],"requestTimestamp":[],"requestNonce":[],"requestSignature":[]},{"panelApiToken":[]}]
  tags: [Admin]
  operationId: getAdminEntitlementRefundQuote
  parameters:
    - { $ref: '../openapi.yaml#/components/parameters/UserID' }
    - { $ref: '../openapi.yaml#/components/parameters/EntitlementID' }
  responses:
    '200':
      description: Observed whole-term traffic suggestion, or unavailable calculation with a reason.
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/AdminEntitlementRefundQuote' }
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
    '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
    '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
    '502': { $ref: '../openapi.yaml#/components/responses/UpstreamFailure' }
post:
  security: [{"browserSession":[],"requestTimestamp":[],"requestNonce":[],"requestSignature":[]},{"panelApiToken":[]}]
  tags: [Admin]
  operationId: refundAdminEntitlement
  summary: Refund an entitlement through a durable audited operation
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/UserID'
    - $ref: '../openapi.yaml#/components/parameters/EntitlementID'
    - $ref: '../openapi.yaml#/components/parameters/IdempotencyKey'
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: '../openapi.yaml#/components/schemas/AdminEntitlementRefundRequest' }
  responses:
    '202':
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/OperationReceipt' }
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
    '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
    '409': { $ref: '../openapi.yaml#/components/responses/Conflict' }
