get:
  security: [{ browserSession: [], requestTimestamp: [], requestNonce: [], requestSignature: [] }]
  tags: [Admin]
  operationId: getNodeCompensationConfig
  summary: Get outage compensation configuration
  responses:
    '200':
      content: { application/json: { schema: { $ref: '../components/schemas/schemas-22.yaml#/NodeCompensationConfig' } } }
    '403': { $ref: '../components/responses.yaml#/Forbidden' }
put:
  security: [{ browserSession: [], requestTimestamp: [], requestNonce: [], requestSignature: [] }]
  tags: [Admin]
  operationId: updateNodeCompensationConfig
  summary: Atomically update outage compensation configuration
  requestBody:
    required: true
    content: { application/json: { schema: { $ref: '../components/schemas/schemas-22.yaml#/NodeCompensationConfigWrite' } } }
  responses:
    '200':
      content: { application/json: { schema: { $ref: '../components/schemas/schemas-22.yaml#/NodeCompensationConfig' } } }
    '409': { $ref: '../components/responses.yaml#/Conflict' }
    '422': { $ref: '../components/responses.yaml#/Unprocessable' }
    '403': { $ref: '../components/responses.yaml#/Forbidden' }
