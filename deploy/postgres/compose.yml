# Standalone infrastructure: docker compose -f deploy/postgres/compose.yml --profile postgres up -d
name: vansail-postgres
services:
  postgres:
    image: postgres:18-bookworm
    profiles: [postgres, application, monitoring]
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: vansail
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=peer
    command: [postgres, -c, password_encryption=scram-sha-256, -c, shared_preload_libraries=pg_stat_statements, -c, max_connections=40]
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init.sh:/docker-entrypoint-initdb.d/10-vansail.sh:ro
      - ./verify.sh:/opt/vansail/verify.sh:ro
    secrets: [postgres_password, application_password, migration_password]
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U postgres -d vansail]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks: [database]
    security_opt: [no-new-privileges:true]

networks:
  database:
    internal: true

volumes:
  postgres_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  application_password:
    file: ./secrets/application_password
  migration_password:
    file: ./secrets/migration_password
