# Overlay onto compose.yml after creating the protected pgbackrest_config secret.
services:
  postgres:
    image: vansail-postgres-recovery:18
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=40
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --config=/run/secrets/pgbackrest_config --stanza=vansail archive-push %p
      - -c
      - archive_timeout=60s
    volumes:
      - pgbackrest_repo:/var/lib/pgbackrest
    secrets:
      - pgbackrest_config

volumes:
  pgbackrest_repo:

secrets:
  pgbackrest_config:
    file: ./secrets/pgbackrest_config
