name: remna-user-panel

services:
  vansail-carpool:
    image: ghcr.io/txyyddss/remna-user-panel:latest
    hostname: vansail-carpool
    restart: unless-stopped
    stop_grace_period: 30s

    environment:
      PORT: 8080
      DATA_DIR: /data
      TZ: ${TZ:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ADMIN_TELEGRAM_ID: "123456789,987654321"
      TELEGRAM_BOT_TOKEN: 114514
      PUBLIC_BASE_URL: https://carpool.example.com
      CONFIG_MASTER_KEY: "GENERATE IT WITH openssl rand -base64 32"

    volumes:
      - tx-carpool-data:/data

    healthcheck:
      test: ["CMD", "/usr/local/bin/vansail-carpool", "healthcheck", "--url", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  tx-carpool-data:
    name: tx-carpool-data
