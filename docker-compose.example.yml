name: remna-user-panel

# Selected 1 GiB embedded PostgreSQL deployment: deploy/embedded/compose.yml.
# Optional, isolated PostgreSQL 18 infrastructure and protected-secret setup:
# deploy/postgres/compose.yml and deploy/postgres/README.md.

services:
  vansail-carpool:
    image: ${VANSAIL_IMAGE:-ghcr.io/vansail-opensource/vansail-carpool:latest}
    hostname: vansail-carpool
    restart: unless-stopped
    stop_grace_period: 90s
    mem_limit: 1g
    memswap_limit: 1g

    environment:
      PG_EMBEDDED: "true"
      DB_DRIVER: postgres
      PORT: 8080
      DATA_DIR: /data
      TZ: ${TZ:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Optional override; otherwise derived automatically from the cgroup limit.
      # GOMEMLIMIT: 160MiB
      ADMIN_TELEGRAM_ID: "123456789,987654321"
      TELEGRAM_BOT_TOKEN: 114514
      PUBLIC_BASE_URL: https://carpool.example.com
      # Exact proxy peer networks only, e.g. "192.0.2.10/32,2001:db8:1::10/128".
      # Empty means forwarding headers are ignored.
      TRUSTED_PROXY_CIDRS: ""
      CONFIG_MASTER_KEY: "GENERATE IT WITH openssl rand -base64 32"

    volumes:
      - tx-carpool-data:/data
      - vansail-postgres-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD", "/usr/local/bin/vansail-carpool", "healthcheck", "--url", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  tx-carpool-data:
    name: tx-carpool-data

  vansail-postgres-data:
    name: vansail-postgres-data
