name: CI

on:
  workflow_call:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.baseline.outputs.full == 'true' || steps.filter.outputs.frontend == 'true' }}
      backend: ${{ steps.baseline.outputs.full == 'true' || steps.filter.outputs.backend == 'true' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Find last successfully published baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/change_base.py
      - name: Detect frontend and backend changes
        id: filter
        if: steps.baseline.outputs.full != 'true'
        uses: dorny/paths-filter@v4
        with:
          base: ${{ steps.baseline.outputs.base }}
          predicate-quantifier: some-with-excludes
          filters: |
            frontend:
              - '.github/workflows/ci.yml'
              - '.github/workflows/container.yml'
              - 'scripts/ci/**'
              - 'web/**'
              - 'api/**'
            backend:
              - '.github/workflows/ci.yml'
              - '.github/workflows/container.yml'
              - 'scripts/ci/**'
              - 'cmd/**'
              - 'internal/**'
              - '*.go'
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'go.work'
              - 'go.work.sum'

  frontend:
    name: Frontend contract and quality
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Generate API types
        working-directory: web
        run: npm run generate:api
      - name: Require committed generated contract
        run: git diff --exit-code -- web/src/api/generated.ts web/src/api/contracts/responseSchemas.json
      - name: Enforce repository structure and localization
        working-directory: web
        run: npm run audit:structure
      - name: Lint frontend
        working-directory: web
        run: npm run lint
      - name: Type-check frontend
        working-directory: web
        run: npm run typecheck
      - name: Test frontend
        working-directory: web
        run: npm run test
      - name: Audit frontend dependencies
        working-directory: web
        run: npm audit --audit-level=high
      - name: Build frontend
        working-directory: web
        run: npm run build

  go-quality-security:
    name: Go quality and security
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Download and verify modules
        run: |
          go mod download
          go mod verify
      - name: Require gofmt
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Vet packages
        run: go vet ./...
      - name: Install pinned vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Scan Go dependencies
        run: govulncheck ./...

  go-race-shards:
    name: Go race shard ${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Run assigned packages and database checks with race detector
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=2m 35m \
            python3 scripts/ci/race_shards.py --shard ${{ matrix.shard }} --directory "$RUNNER_TEMP/race"
      - name: Upload race diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-race-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/race/*
          if-no-files-found: warn
          retention-days: 14

  go-race-coverage:
    name: Go race and coverage
    needs: [changes, go-race-shards]
    if: always() && needs.go-race-shards.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Download shard inventories and diagnostics
        uses: actions/download-artifact@v8
        with:
          pattern: go-race-shard-*
          path: ${{ runner.temp }}/race
          merge-multiple: true
      - name: Require complete race coverage
        run: python3 scripts/ci/race_shards.py --verify --directory "$RUNNER_TEMP/race"
      - name: Measure large inventory memory and lookup allocations
        run: go test ./internal/iplookup -run '^$' -bench '^BenchmarkProxyInventory' -benchtime=1x -benchmem
      - name: Enforce domain coverage
        shell: bash
        run: |
          packages=(
            ./internal/accounts
            ./internal/admin
            ./internal/billing
            ./internal/catalog
            ./internal/entitlements
          )
          go test -covermode=atomic -coverprofile=domain-coverage.out "${packages[@]}"
          go tool cover -func=domain-coverage.out
          total="$(go tool cover -func=domain-coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          awk -v total="$total" 'BEGIN { if ((total + 0) < 70) { printf "coverage %.1f%% is below 70%%\n", total; exit 1 } }'

  memory-soak:
    name: USDT and proxy 256 MiB memory soak
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile non-race memory fixture
        env:
          CGO_ENABLED: '0'
        run: go test -c -o "$RUNNER_TEMP/memory-soak" ./internal/iplookup
      - name: Exercise scanners, refreshes and reader retirement without swap
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/memory-data/tmp"
          trap 'docker inspect memory-soak > "$RUNNER_TEMP/memory-data/container.json" || true' EXIT
          docker run --name memory-soak --memory=256m --memory-swap=256m \
            --network=none --read-only --tmpfs /tmp:rw,size=16m \
            -v "$RUNNER_TEMP/memory-soak:/soak:ro" \
            -v "$RUNNER_TEMP/memory-data:/data:rw" \
            -e TMPDIR=/data/tmp -e SQLITE_TMPDIR=/data/tmp \
            -e GOMEMLIMIT=160MiB -e VANSAIL_MEMORY_SOAK=1 \
            alpine:3.24 /soak -test.run '^TestUSDTProxyMemorySoak$' -test.v \
            -test.timeout=20m -test.memprofile=/data/heap.pprof \
            | tee "$RUNNER_TEMP/memory-data/soak.log"
          test "$(docker inspect -f '{{.State.OOMKilled}}' memory-soak)" = false
          test "$(docker inspect -f '{{.RestartCount}}' memory-soak)" = 0
      - name: Upload memory evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: memory-soak
          path: |
            ${{ runner.temp }}/memory-data/soak.log
            ${{ runner.temp }}/memory-data/container.json
            ${{ runner.temp }}/memory-data/heap.pprof
          retention-days: 14

  image-validation:
    name: Production image validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Validate production image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=tx-carpool
          cache-to: type=gha,mode=max,scope=tx-carpool

  xnode-performance:
    name: X-Node steady-state CPU profile
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Profile old and cached reconciliation work
        run: go test ./internal/xnode -run '^$' -bench BenchmarkXNodeSteadyState -benchtime=2s -benchmem -cpuprofile=xnode-cpu.pprof -o /tmp/xnode-profile.test > xnode-benchmark.txt
      - uses: actions/upload-artifact@v7
        with:
          name: xnode-cpu-profile
          path: |
            xnode-cpu.pprof
            xnode-benchmark.txt
