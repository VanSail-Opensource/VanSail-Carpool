name: PostgreSQL migration gates

on:
  workflow_call:

permissions:
  contents: read

env:
  COMPOSE_FILE: deploy/postgres/compose.yml:deploy/postgres/compose.recovery.yml:deploy/postgres/compose.monitoring.yml
  COMPOSE_PROFILES: postgres

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify PostgreSQL-only bootstrap configuration
        run: go test ./internal/platform/config
      - name: Create protected infrastructure secrets
        run: |
          umask 077
          mkdir -p deploy/postgres/secrets
          for role in postgres application migration monitoring; do
            openssl rand -hex 32 > "deploy/postgres/secrets/${role}_password"
            chmod 0444 "deploy/postgres/secrets/${role}_password"
          done
          cp deploy/postgres/pgbackrest.conf.example deploy/postgres/secrets/pgbackrest_config
          pass=$(openssl rand -hex 32)
          sed -i "s/REPLACE_WITH_INDEPENDENT_RECOVERY_SECRET/$pass/" deploy/postgres/secrets/pgbackrest_config
          chmod 0444 deploy/postgres/secrets/pgbackrest_config
          docker compose config --quiet
      - name: Start PostgreSQL 18
        run: docker compose up -d --build --wait
      - name: Verify SCRAM authentication and application privileges
        run: docker compose exec -T postgres sh /opt/vansail/verify.sh
      - name: Initialize encrypted WAL repository
        run: docker compose exec -T --user postgres postgres pgbackrest --config=/run/secrets/pgbackrest_config --stanza=vansail stanza-create
      - name: Verify fresh PostgreSQL baseline and migration contracts
        id: baseline
        env:
          CGO_ENABLED: 0
        run: |
          go test -c -o "$RUNNER_TEMP/postgres.test" ./internal/platform/database/postgres
          container=$(docker compose ps -q postgres)
          docker cp "$RUNNER_TEMP/postgres.test" "$container:/tmp/postgres.test"
          docker compose exec -T postgres sh -c '
            password=$(cat /run/secrets/migration_password)
            export POSTGRES_TEST_URL="postgres://vansail_migration:$password@127.0.0.1/vansail?sslmode=disable"
            admin=$(cat /run/secrets/postgres_password)
            export POSTGRES_TEST_ADMIN_URL="postgres://postgres:$admin@127.0.0.1/postgres?sslmode=disable"
            /tmp/postgres.test -test.v
          '
      - name: Run business contracts and concurrency checks on PostgreSQL
        env:
          CGO_ENABLED: 0
        run: |
          go test -c -o "$RUNNER_TEMP/database.test" ./internal/platform/database
          container=$(docker compose ps -q postgres)
          docker cp "$RUNNER_TEMP/database.test" "$container:/tmp/database.test"
          docker compose exec -T postgres sh -c '
            password=$(cat /run/secrets/postgres_password)
            export POSTGRES_CONTRACT_URL="postgres://postgres:$password@127.0.0.1/vansail?sslmode=disable"
            /tmp/database.test -test.v -test.parallel=2 -test.timeout=20m
          '
      - name: Verify administrative logical export and isolated restoration
        if: ${{ !cancelled() && steps.baseline.outcome == 'success' }}
        env:
          CGO_ENABLED: 0
        run: |
          go test -c -o "$RUNNER_TEMP/backup.test" ./internal/platform/backup
          container=$(docker compose ps -q postgres)
          docker cp "$RUNNER_TEMP/backup.test" "$container:/tmp/backup.test"
          docker compose exec -T postgres sh -c '
            password=$(cat /run/secrets/migration_password)
            admin=$(cat /run/secrets/postgres_password)
            application=$(cat /run/secrets/application_password)
            export POSTGRES_RECOVERY_TEST_URL="postgres://vansail_app:$application@127.0.0.1/vansail?sslmode=disable"
            export POSTGRES_RECOVERY_MIGRATION_URL="postgres://vansail_migration:$password@127.0.0.1/vansail?sslmode=disable"
            export POSTGRES_RECOVERY_ADMIN_URL="postgres://postgres:$admin@127.0.0.1/vansail?sslmode=disable"
            /tmp/backup.test -test.v -test.timeout=5m -test.run TestPostgresLogicalRecovery
          '
      - name: Verify encrypted physical backup and point-in-time recovery
        if: ${{ !cancelled() && steps.baseline.outcome == 'success' }}
        env:
          CGO_ENABLED: 0
        run: |
          go build -o "$RUNNER_TEMP/db-schema" ./cmd/db-schema
          container=$(docker compose ps -q postgres)
          docker cp "$RUNNER_TEMP/db-schema" "$container:/tmp/db-schema"
          bash scripts/ci/postgresql_recovery.sh
      - name: Verify PostgreSQL application composition and single ownership
        if: ${{ !cancelled() && steps.baseline.outcome == 'success' }}
        env:
          CGO_ENABLED: 0
        run: |
          go test -c -o "$RUNNER_TEMP/application.test" ./internal/app
          container=$(docker compose ps -q postgres)
          docker cp "$RUNNER_TEMP/application.test" "$container:/tmp/application.test"
          docker compose exec -T postgres sh -c '
            password=$(cat /run/secrets/postgres_password)
            export POSTGRES_BOOTSTRAP_ADMIN_URL="postgres://postgres:$password@127.0.0.1/vansail?sslmode=disable"
            application=$(cat /run/secrets/application_password)
            export POSTGRES_BOOTSTRAP_APP_URL="postgres://vansail_app:$application@127.0.0.1/vansail?sslmode=disable"
            /tmp/application.test -test.v -test.timeout=5m -test.run TestPostgresApplicationBootstrap
          '
      - name: Verify private exporter and aggregate monitoring grants
        if: ${{ !cancelled() && steps.baseline.outcome == 'success' }}
        run: |
          docker compose exec -T --user postgres postgres sh /opt/vansail/monitoring-init.sh
          docker compose --profile monitoring up -d postgres-exporter
          exporter=$(docker compose ps -q postgres-exporter)
          for attempt in $(seq 1 10); do
            if docker run --rm --network "container:$exporter" alpine:3.24 wget -T 15 -qO- http://127.0.0.1:9187/metrics > "$RUNNER_TEMP/postgres.metrics" &&
              grep -Eq '^pg_up(\{[^}]*\})? 1$' "$RUNNER_TEMP/postgres.metrics" &&
              grep -Eq '^vansail_financial_discrepancies(\{[^}]*\})? 0$' "$RUNNER_TEMP/postgres.metrics"; then break; fi
            sleep 2
          done
          docker compose --profile monitoring logs --no-color postgres-exporter
          grep -E '^(pg_up|pg_exporter_last_scrape_error|vansail_)' "$RUNNER_TEMP/postgres.metrics"
          grep -Eq '^pg_up(\{[^}]*\})? 1$' "$RUNNER_TEMP/postgres.metrics"
          grep -Eq '^pg_exporter_last_scrape_error(\{[^}]*\})? 0$' "$RUNNER_TEMP/postgres.metrics"
          grep -Eq '^vansail_financial_discrepancies(\{[^}]*\})? 0$' "$RUNNER_TEMP/postgres.metrics"
          grep -q '^vansail_accounting_known_sequence_backlog' "$RUNNER_TEMP/postgres.metrics"
      - name: Stop isolated infrastructure
        if: always()
        run: |
          docker compose logs --no-color postgres
          docker compose down -v
